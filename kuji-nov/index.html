<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f0ed">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<title>SMG STORE 11월 고객감사 이벤트</title>
<style>
:root{
  --gold:#c42429; --gold2:#080403; --red:#e8212e; --ink:#221a33;
  --font:"Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans CJK KR","Nanum Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:only light!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  color-scheme:only light!important;-webkit-filter:none!important;filter:none!important;background-color:#f3f0ed}
*{color-scheme:only light}
/* Fully Kiosk / Android WebView forced-dark: keep light rendering */
@media (prefers-color-scheme: dark){
  html,body,#app{color-scheme:only light!important;
    -webkit-filter:none!important;filter:none!important}
  html,body{background-color:#f3f0ed!important}
}
body{font-family:var(--font);color:#fff;background:#f3f0ed;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;word-break:keep-all}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;border:0;color:inherit;background:none}
button:focus{outline:none}
button:focus-visible{outline:3px solid #7c3aed;outline-offset:2px}
[hidden]{display:none!important}

/* ===== Layout ===== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  background:
    repeating-conic-gradient(from 0deg at 50% 115%, rgba(196,36,41,.075) 0 5deg, transparent 5deg 10deg),
    radial-gradient(circle at 12% 20%, rgba(196,36,41,.16), transparent 35%),
    radial-gradient(circle at 88% 85%, rgba(255,255,255,.05), transparent 35%),
    radial-gradient(ellipse at 50% 0%, #ffffff 0%, #f7f5f3 48%, #f3f0ed 100%);}
#btnBack{display:none!important}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;
  padding-top:max(10px,env(safe-area-inset-top));
  background:linear-gradient(180deg,#ffffff 0%,#f7f5f3 60%,#f3f0ed 100%);
  border-bottom:4px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.4);position:relative;z-index:2}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:6px;
  background:radial-gradient(circle,var(--gold) 2px,transparent 2.5px) 0 0/14px 6px;opacity:.8}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{flex:0 0 auto;height:70px;max-width:180px;padding:4px 9px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--gold),0 4px 12px rgba(0,0,0,.4)}
.logo img{display:block;height:100%;width:auto;max-width:160px;object-fit:contain}
.brand-txt{min-width:0}
.brand .sub{font-size:12px;letter-spacing:.32em;color:#c42429;font-weight:800;white-space:nowrap}
.brand h1{font-size:clamp(20px,2.7vw,36px);font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 2px 0 #7a0016,0 4px 10px rgba(0,0,0,.35)}
.stats{display:flex;gap:10px;align-items:stretch;flex:0 0 auto}
.stat{background:rgba(60,0,15,.35);border:2px solid rgba(196,36,41,.7);border-radius:14px;padding:5px 14px;text-align:center;
  display:flex;flex-direction:column;justify-content:center;min-width:104px}
.stat .lbl{font-size:13px;color:#c42429;font-weight:800;white-space:nowrap}
.stat .val{font-size:30px;font-weight:900;line-height:1.05;white-space:nowrap}
.stat .val small{font-size:15px;color:#ffd9de;font-weight:800}
.stat.cust{flex-direction:row;align-items:center;gap:10px}
.cust-reset{font-size:13px;font-weight:900;background:var(--gold);color:#8a0a1f;border-radius:999px;padding:8px 12px;white-space:nowrap;box-shadow:0 3px 0 #b07b00}
.cust-reset:active{transform:translateY(2px);box-shadow:0 1px 0 #b07b00}
.tools{display:flex;gap:8px;flex:0 0 auto}
.icon-btn{width:50px;height:50px;border-radius:14px;background:rgba(60,0,15,.3);display:grid;place-items:center;border:2px solid rgba(255,255,255,.28)}
.icon-btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.92)}
.icon-btn.gear{opacity:.45;border-color:transparent;background:transparent}
.pay-btn{position:relative;width:auto;padding:0 14px;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#fff;white-space:nowrap}
.pay-btn svg{width:22px;height:22px}
.pb-count{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--gold);color:#8a0a1f;font-size:13px;font-style:normal;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.stage{flex:1;min-height:0;display:flex;gap:14px;padding:18px 14px 14px;padding-bottom:max(14px,env(safe-area-inset-bottom))}

/* ===== Prize board ===== */
.board{flex:0 0 clamp(250px,25vw,360px);display:flex;flex-direction:column;gap:6px;overflow:hidden;min-height:0;padding:0 4px 6px 2px}
.board-art{position:relative;flex:1 1 auto;min-height:320px;border-radius:18px;overflow:hidden;margin-top:6px;
  border:3px solid rgba(196,36,41,.55);box-shadow:0 0 0 2px rgba(196,36,41,.3),0 10px 22px rgba(0,0,0,.35);
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.16),transparent 55%),#f3f0ed}
.board-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;transform:scale(1.06);transform-origin:center}
.board-lights{position:absolute;inset:0;pointer-events:none;z-index:2}
.board-lights .bulb{position:absolute;width:14px;height:14px;border-radius:50%;
  box-shadow:0 0 8px 3px currentColor,0 0 20px 7px currentColor,0 0 28px 10px rgba(255,255,200,.35);opacity:.95;animation:bulbBlink 1.15s ease-in-out infinite}
.board-lights .bulb:nth-child(odd){animation-duration:1.4s}
.board-lights .bulb:nth-child(3n){animation-duration:.95s;animation-delay:.18s}
.board-lights .bulb:nth-child(4n){animation-delay:.4s}
.board-lights .wire{position:absolute;left:3%;right:3%;top:8%;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(255,230,150,.65),transparent);opacity:.75}
.board-lights .wire.b{top:auto;bottom:9%}
@keyframes bulbBlink{0%,100%{opacity:.3;transform:scale(.9)}45%{opacity:1;transform:scale(1.12)}75%{opacity:.7}}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 2px}
.board-head .bh-title{font-size:20px;font-weight:900;color:var(--gold);text-shadow:0 2px 4px rgba(0,0,0,.5);letter-spacing:.02em}
.board-head .bh-sub{font-size:14px;font-weight:800;color:#e9dcff;white-space:nowrap}
.tier-row{--c:#888;flex:0 0 auto;display:flex;align-items:center;gap:10px;background:#fff;color:#222;border-radius:14px;padding:7px 10px 7px 8px;
  border-left:9px solid var(--c);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 55%,#000),0 6px 14px rgba(0,0,0,.28);transition:opacity .3s,filter .3s}
.badge{--c:#888;flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:23px;line-height:1;
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 58%,color-mix(in srgb,var(--c) 70%,#000));
  text-shadow:0 2px 2px rgba(0,0,0,.4);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c),0 3px 6px rgba(0,0,0,.3)}
.badge.sm-txt{font-size:12px;text-align:center;line-height:1}
.tier-info{flex:1;min-width:0}
.tier-name{font-weight:900;font-size:18px;line-height:1.2;color:color-mix(in srgb,var(--c) 82%,#000)}
.tier-prize{font-size:14.5px;font-weight:700;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.thumb{flex:0 0 auto;width:48px;height:48px;border-radius:10px;overflow:hidden;background:#f3f0fa;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:76%;height:76%}
.tier-count{flex:0 0 auto;font-weight:900;font-size:25px;min-width:64px;text-align:right;color:#1d1530;line-height:1;white-space:nowrap}
.tier-count small{font-size:15px;color:#8a82a0;font-weight:800}
.tier-row.out{opacity:.5;filter:grayscale(.85)}
.tier-row.out .tier-count{font-size:15px;color:#999}
.tier-row.lastone{background:linear-gradient(135deg,#ffffff,#f3f0ed 60%,#c42429);border-left-color:#080403}
.tier-row.lastone .tier-name{color:#080403}
.tier-row.hot{animation:hot 1.2s ease-in-out infinite}
.board{container-type:inline-size}
@container (max-width:340px){
  .tier-row{gap:8px;padding:6px 8px 6px 6px}
  .tier-row .badge{width:40px;height:40px;font-size:20px}
  .tier-row .badge.sm-txt{font-size:11px}
  .tier-row .thumb{width:38px;height:38px}
  .tier-row .thumb.noimg{display:none}
  .tier-count{min-width:48px;font-size:22px}
  .tier-count small{font-size:13px}
  .tier-name{font-size:17px}
  .tier-prize{font-size:14px}
}
@keyframes hot{50%{box-shadow:0 3px 0 #080403,0 0 0 4px #fff3,0 0 26px 6px rgba(196,36,41,.85)}}
/* ===== Ticket grid ===== */
.grid-wrap{flex:1;min-width:0;min-height:0;position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,.06);
  border:2px solid rgba(196,36,41,.4);border-radius:22px;padding:8px 10px 10px;box-shadow:inset 0 0 40px rgba(0,0,0,.3)}
.hint{flex:0 0 auto;text-align:center;font-weight:900;font-size:clamp(17px,2vw,24px);color:var(--gold);padding:2px 0 8px;text-shadow:0 2px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint.last{color:#fff;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{color:var(--gold);transform:scale(1.04)}}
.grid-scroll{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
.grid{--tw:80px;--gap:8px;--cols:10;display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols),var(--tw));margin:auto;padding:2px 2px 6px}
.ticket{position:relative;display:block;width:var(--tw);height:calc(var(--tw)*1.25);border-radius:calc(var(--tw)*.13);overflow:hidden;color:#fff;
  font-size:calc(var(--tw)*.2);font-weight:900;
  background:linear-gradient(160deg,#ffffff 0%,#f7f5f3 100%);
  box-shadow:inset 0 0 0 2px rgba(255,222,120,.95),inset 0 0 0 calc(var(--tw)*.06) rgba(255,255,255,.12),0 4px 0 #050816,0 7px 12px rgba(0,0,0,.35);
  transition:transform .12s ease}
.ticket::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 50% 50%,rgba(255,240,180,.35),transparent 45%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 5px,transparent 5px 11px)}
.ticket::after{content:"";position:absolute;top:-40%;left:-90%;width:45%;height:180%;transform:translateX(0) rotate(18deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,86%{transform:translateX(0) rotate(18deg)}100%{transform:translateX(533%) rotate(18deg)}} /* transform only: no layout/paint per frame */
.grid.still .ticket::after{animation-play-state:paused}
.t-top{display:none}
.ticket.used .t-top{display:block;position:absolute;top:7%;left:0;right:0;text-align:center;color:#cfc6e6;font-size:.62em;letter-spacing:.08em;line-height:1}
.t-num{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ffffff,#c42429 60%,#c42429);color:#a50b3f;font-size:1.05em;line-height:1;
  box-shadow:0 0 0 2px rgba(255,255,255,.7),0 2px 5px rgba(0,0,0,.4)}
.t-logo{position:absolute;left:12%;right:12%;top:auto;bottom:6%;aspect-ratio:3/2;box-sizing:border-box;padding:2.5% 3%;border-radius:calc(var(--tw)*.09);
  background:#fff var(--ticket-logo,none) center/contain no-repeat;background-origin:content-box;
  box-shadow:0 0 0 2px #c42429,0 0 0 calc(2px + var(--tw)*.02) rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.35)}
.t-no{position:absolute;left:12%;right:12%;top:6%;bottom:auto;aspect-ratio:3/2;box-sizing:border-box;padding:3% 2%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:calc(var(--tw)*.32);font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1;
  text-shadow:0 2px 4px rgba(0,0,20,.85),0 0 12px rgba(0,0,0,.4);overflow:hidden;z-index:1}
.t-perf{position:absolute;left:14%;right:14%;top:50%;height:0;border:0;border-top:2px dashed rgba(255,230,150,.95);z-index:3;pointer-events:none}
.grid.tiny .t-no{font-size:calc(var(--tw)*.3);padding:2% 1%}
.grid.tiny .t-logo{left:14%;right:14%;bottom:5%;padding:2%}
.t-bot{position:absolute;bottom:6%;left:0;right:0;text-align:center;font-size:.52em;color:#ffe9ef;letter-spacing:.06em;line-height:1}
.ticket:not(.used):active{transform:scale(.93) rotate(-2deg)}
.ticket.used{background:linear-gradient(160deg,#5b4f7c,#352c52);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);opacity:.55;pointer-events:none}
.ticket.used::before,.ticket.used::after{display:none}
.ticket.used .t-num{background:#fff;color:var(--c,#555);box-shadow:0 0 0 3px var(--c,#555)}
.ticket.used .t-top,.ticket.used .t-bot{color:#cfc6e6}
.ticket.used .t-perf{border-color:rgba(255,255,255,.2)}
.ticket.hide{visibility:hidden}
.grid.tiny .t-top,.grid.tiny .t-bot{display:none}
.grid.tiny .ticket:not(.used) .t-no{display:flex}
.soldout{position:absolute;inset:0;border-radius:20px;background:rgba(20,6,48,.72);backdrop-filter:blur(2px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.so-stamp{font-size:clamp(56px,9vw,110px);font-weight:900;color:#ff3552;border:8px solid #ff3552;border-radius:24px;padding:0 30px;transform:rotate(-10deg);
  background:rgba(255,255,255,.92);box-shadow:0 10px 40px rgba(0,0,0,.5);line-height:1.25}
.soldout p{font-size:clamp(18px,2.2vw,26px);font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.soldout small{font-size:15px;color:#d8ccf5;font-weight:700}

/* ===== Draw overlay ===== */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(60,20,110,.9),rgba(8,0,20,.96));backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.ov-rays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;opacity:0;transition:opacity .6s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--rc,rgba(196,36,41,.5)) 0 7deg,transparent 7deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,transparent 50%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 22%,transparent 50%);
  animation:spin 26s linear infinite}
.ov-rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-stage{position:relative;z-index:1;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.bigticket{--bw:min(56vw,48vh,380px);--c:#888;position:absolute;left:50%;top:50%;width:var(--bw);height:calc(var(--bw)*1.25);
  margin-left:calc(var(--bw)*-.5);margin-top:calc(var(--bw)*-.625);font-size:calc(var(--bw)*.2)}
.bigticket .bt-glow{position:absolute;inset:-45%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 60%,#fff) 0%,transparent 62%);opacity:0;transition:opacity .5s,transform .8s;transform:scale(.6)}
.bigticket .bt-inner{position:absolute;inset:3%;border-radius:calc(var(--bw)*.1);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 40%,#fff 0%,color-mix(in srgb,var(--c) 22%,#fff) 70%);box-shadow:inset 0 0 0 4px var(--c)}
.bt-letter{font-size:3em;line-height:1;color:var(--c);font-weight:900;text-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}
.bt-label{font-size:.7em;font-weight:900;color:color-mix(in srgb,var(--c) 80%,#000);margin-top:.2em}
.bigticket .half{position:absolute;inset:0;transition:transform .75s cubic-bezier(.3,.7,.25,1),opacity .75s ease-in;will-change:transform}
.bigticket .half .ticket{--tw:var(--bw);width:100%;height:100%}
.bigticket .half .ticket::after{animation:none;display:none}
.bigticket.shake{animation:shake 1s linear}
@keyframes shake{
  0%,100%{transform:none}
  10%{transform:translate(-3px,0) rotate(-2deg)} 20%{transform:translate(3px,-2px) rotate(2deg)}
  30%{transform:translate(-5px,1px) rotate(-3deg)} 40%{transform:translate(5px,-1px) rotate(3deg)}
  50%{transform:translate(-6px,2px) rotate(-4deg) scale(1.03)} 60%{transform:translate(6px,-2px) rotate(4deg) scale(1.04)}
  70%{transform:translate(-7px,1px) rotate(-4deg) scale(1.05)} 80%{transform:translate(7px,-1px) rotate(4deg) scale(1.06)}
  90%{transform:translate(-4px,0) rotate(-2deg) scale(1.07)}}
.bigticket.torn .half.l{transform:translate(-70%,14%) rotate(-28deg);opacity:0}
.bigticket.torn .half.r{transform:translate(70%,14%) rotate(28deg);opacity:0}
.bigticket.torn .bt-glow{opacity:1;transform:scale(1)}
.bigticket.torn .bt-inner{animation:innerPop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes innerPop{0%{transform:scale(.9)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.bigticket.fade{transition:opacity .3s,transform .3s;opacity:0;transform:scale(1.25)}
.result{--c:#888;position:relative;z-index:1;width:min(92vw,600px);max-height:calc(100% - 8px);overflow:auto;text-align:center;color:#222;
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 100%);border-radius:30px;padding:26px 24px 24px;
  box-shadow:0 0 0 7px var(--c),0 0 0 12px #fff,0 24px 70px rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:popIn .55s cubic-bezier(.2,1.45,.4,1) both}
@keyframes popIn{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.res-head{font-size:clamp(24px,4vh,34px);font-weight:900;color:color-mix(in srgb,var(--c) 85%,#000);letter-spacing:.02em}
.res-visual{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,28px);margin:6px 0 4px;flex-wrap:wrap}
.res-badge{--s:clamp(120px,24vh,190px);width:var(--s);height:var(--s);font-size:calc(var(--s)*.52);border-radius:50%;display:grid;place-items:center;
  color:#fff;font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.25);
  background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--c) 40%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 65%,#000));
  box-shadow:0 0 0 6px #fff,0 0 0 11px var(--c),0 10px 24px rgba(0,0,0,.3)}
.res-badge.long{font-size:calc(var(--s)*.3)}
.result.withimg .res-badge{--s:clamp(96px,17vh,150px)}
.res-img{width:clamp(130px,26vh,230px);aspect-ratio:1;border-radius:20px;overflow:hidden;background:#f4f1ff;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c),0 8px 18px rgba(0,0,0,.25)}
.res-img img{width:100%;height:100%;object-fit:cover;display:block}
.res-tier{font-size:clamp(34px,6.5vh,56px);font-weight:900;line-height:1.1;color:color-mix(in srgb,var(--c) 88%,#000);margin-top:6px}
.res-prize{font-size:clamp(22px,4vh,34px);font-weight:900;line-height:1.25;color:#1d1530}
.res-meta{font-size:15px;color:#7a728e;font-weight:700;margin-top:2px}
.res-extra{margin-top:6px;font-size:18px;font-weight:900;color:#080403;background:#ffffff;border:2px dashed #080403;border-radius:12px;padding:6px 14px}
.btn-ok{margin-top:12px;min-width:240px;height:66px;border-radius:999px;font-size:27px;font-weight:900;color:#fff;letter-spacing:.1em;

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
/* ===== Modals ===== */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,0,25,.72);backdrop-filter:blur(3px)}

.panel{background:#fff;color:var(--ink);border-radius:24px;padding:24px;width:min(94vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:popIn .3s ease-out both}

#dialog{z-index:90}
.pin-panel{width:min(94vw,380px);text-align:center}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:68px;border-radius:16px;background:#f1edfa;color:var(--ink);font-size:28px;font-weight:900}

.pin-msg{min-height:22px;font-size:15px;font-weight:700;color:#e8212e;margin-top:10px}
.btn{height:52px;padding:0 20px;border-radius:14px;font-size:17px;font-weight:800;background:#ece8f6;color:#2b2340;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.btn.primary{background:#6d28d9;color:#fff;box-shadow:0 3px 0 #4c1d95}
.btn.danger{background:#e8212e;color:#fff;box-shadow:0 3px 0 #9b0f1a}

/* ===== Settings ===== */

.log{width:100%;border-collapse:collapse;font-size:15.5px}

.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* ----- 지급 관리 ----- */

.pay-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

.st-bar{height:12px;border-radius:99px;background:#eee8fb;overflow:hidden;margin:10px 0 8px}.st-bar i{display:block;height:100%;background:linear-gradient(90deg,#7b5cff,#b06bff);border-radius:inherit}

.st-msg{margin-top:10px;padding:10px 12px;border-radius:12px;background:#ffffff;color:#080403;font-size:14px;font-weight:700;line-height:1.5}.st-card.bad .st-msg{background:#ffe6ea;color:#9a1028}
.sync-card .sync-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.sw.big{font-size:17px;font-weight:900}
.sync-stat{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:14.5px;font-weight:800;background:#f1eff7;color:#6b6385;max-width:100%}

.sync-stat.ok{background:#e3f8ea;color:#11683a}.sync-stat.ok i{background:#19b45a;box-shadow:0 0 0 4px rgba(25,180,90,.18)}
.sync-stat.wait{background:#ffffff;color:#080403}.sync-stat.wait i{background:#c42429}
.sync-stat.bad{background:#ffe6ea;color:#9a1028}.sync-stat.bad i{background:#e0314b}

.sync-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}.sync-row .btn-row{flex-wrap:nowrap}.sync-row .btn-row .inp{flex:1 1 auto;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}

.sync-devname{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px;font-size:15px}

@media (max-width:700px){.tab-card .tab-row{grid-template-columns:1fr}}
.sell-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}

.sell-chip input{width:24px;height:24px;flex:0 0 auto;accent-color:var(--c,#7c3aed)}
.sell-chip.on{border-color:var(--c,#7c3aed);background:color-mix(in srgb,var(--c,#7c3aed) 10%,#fff)}
.sell-chip small{display:block;font-size:12px;font-weight:700;color:#6b6385}
.sell-chip.conf{border-color:#e0314b;border-style:dashed;background:#fff1f3}.sell-chip.conf small{color:#b4233c}
.sell-chip .sc-tx{display:flex;flex-direction:column;min-width:0}
.tab-note{margin-top:10px;padding:10px 12px;border-radius:12px;background:#f6f3ff;font-size:13.5px;font-weight:700;color:#4b4368;line-height:1.5}
.tab-note.warn{background:#ffffff;color:#080403}.tab-note.bad{background:#ffe6ea;color:#9a1028}

.pay-more{display:flex;justify-content:center;padding:14px 0 4px}.pay-more .btn{min-width:220px}
.plist{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(40,20,90,.08);padding:0 0 6px}
.phead,.prow{display:grid;grid-template-columns:118px 56px 72px minmax(0,1fr) 172px;gap:10px;align-items:center;padding:0 14px}
.phead{position:sticky;top:-18px;z-index:2;background:#2a0e5a;color:#e9dcff;font-size:13.5px;font-weight:800;height:42px;border-radius:18px 18px 0 0}
.pgroup{border-top:3px solid #e4dcf7;content-visibility:auto;contain-intrinsic-size:auto 220px} /* off-screen customer groups are not laid out/painted */

.prow{min-height:64px;border-top:1px solid #efebf7;padding-top:5px;padding-bottom:5px}
.pc-time small{display:block;font-size:12px;color:#8a82a0;font-weight:700;line-height:1.2}

.pc-prize{display:flex;align-items:center;gap:10px;min-width:0}

.pc-prize .badge.sm-txt{font-size:10px}
.pc-prize .lo-badge{box-shadow:0 0 0 2px #fff,0 0 0 4px #c42429}
.pc-prize div{min-width:0;line-height:1.25}
.pc-prize b{font-size:17px;font-weight:900;color:var(--ink);margin-right:6px}
.pc-prize span{font-size:16px;font-weight:700;color:#2b2340;word-break:keep-all}

@media (max-width:700px){

}
#toast{position:fixed;left:50%;bottom:28px;z-index:100;transform:translateX(-50%) translateY(20px);background:rgba(20,10,40,.94);color:#fff;
  font-size:17px;font-weight:800;padding:14px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%)}
.settings.show~#toast{bottom:92px}

/* ===== play count (플레이 횟수) ===== */
.stat.cust .lbl b{color:#fff;font-weight:900}
.stat.cust .val span:first-child{color:var(--gold)}
.stat.cust.zero .val span:first-child{color:#ffd0d6}
.stat.cust.idle .val small{display:none}
.stat.cust.zero .cust-reset{position:relative;isolation:isolate}
.stat.cust.zero .cust-reset::after{content:"";position:absolute;inset:0;border-radius:inherit;background:transparent;box-shadow:0 0 0 7px rgba(196,36,41,.45);z-index:-1;opacity:0;animation:nudgeBtn 1.6s ease-in-out infinite;pointer-events:none}
@keyframes nudgeBtn{50%{opacity:1}} /* opacity only (compositor), the old box-shadow pulse repainted every frame while idle */
.lockov{position:absolute;inset:0;border-radius:20px;background:rgba(20,6,48,.58);backdrop-filter:blur(1.5px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:3}
.lockov[hidden]{display:none}
.lock-card{background:linear-gradient(180deg,#ffffff,#ffffff);color:#3a2a00;border-radius:26px;padding:26px 34px;max-width:560px;text-align:center;box-shadow:0 0 0 4px var(--gold),0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:8px}
.lock-card svg{width:64px;height:64px;fill:none;stroke:#c98a00;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lock-card b{font-size:clamp(22px,2.8vw,32px);font-weight:900;color:#2a0e5a;line-height:1.3;word-break:keep-all}
.lock-card span{font-size:clamp(15px,1.6vw,18px);font-weight:700;color:#6b5a2a;word-break:keep-all}
.lock-card.nudge{animation:gentle .5s ease-in-out}
@keyframes gentle{25%{transform:translateX(-7px) rotate(-1deg)}50%{transform:translateX(6px) rotate(1deg)}75%{transform:translateX(-3px)}}
.play-panel{width:min(94vw,520px);text-align:center}
.play-panel .seg{display:flex;margin:4px 0 10px}
.play-panel .seg button{flex:1;height:50px;font-size:16.5px}
.pm-info{font-size:16px!important;font-weight:700;color:#4a4260;margin-bottom:4px}

.pm-count{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
.pm-count button{width:78px;height:78px;border-radius:22px;background:#ece8f6;font-size:42px;font-weight:900;color:#4b4266;box-shadow:0 3px 0 #cfc6e6}

.pm-num{min-width:150px;display:flex;align-items:baseline;justify-content:center;gap:4px}

.pm-num span{font-size:26px;font-weight:900;color:#6b6385}
.pm-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pm-quick button{height:62px;border-radius:16px;background:#f6f3fd;border:3px solid #e4dcf7;font-size:24px;font-weight:900;color:#2a0e5a}
.pm-quick button small{font-size:15px;margin-left:1px}
.pm-quick button.on{background:#6d28d9;border-color:#6d28d9;color:#fff}
.pm-quick button.over{opacity:.5}
.pm-msg{min-height:26px;margin-top:10px;font-size:15px!important;font-weight:800;color:#b45309!important}
.play-panel .row-btns{justify-content:stretch}
.play-panel .row-btns .btn{flex:1;height:60px;font-size:19px}
.play-panel .row-btns .btn.primary{flex:2}
.result.summary{--c:#6d28d9;width:min(94vw,640px);padding-bottom:18px}
.sum-sub{font-size:17px;font-weight:800;color:#6b6385;margin:2px 0 10px}
.sum-sub b{color:#2a0e5a;font-size:20px}
.sum-list{align-self:stretch;display:flex;flex-direction:column;gap:7px;text-align:left}
.sum-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:7px 18px 7px 10px;border-radius:14px;background:#f7f5fc;border-left:6px solid var(--c)}
.sum-row .badge{width:50px;height:50px;font-size:24px}
.sum-row .badge.sm-txt{font-size:10px}
.sum-row.lo{background:linear-gradient(90deg,#ffffff,#f3f0ed);border-left-color:#c42429}
.sr-name{min-width:0;line-height:1.25}
.sr-name b{font-size:21px;font-weight:900;color:#1d1530;margin-right:6px}
.sr-name span{font-size:20px;font-weight:800;color:#2b2340;word-break:keep-all}
.sr-name small{display:block;font-size:14px;font-weight:700;color:#8a82a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-qty{font-size:32px;font-weight:900;color:#6d28d9;font-variant-numeric:tabular-nums}
.sum-empty{padding:18px;font-size:18px;font-weight:800;color:#6b6385;text-align:center}
.sum-note{margin-top:10px;font-size:15px;font-weight:800;color:#9a3412;background:#ffffff;border-radius:12px;padding:8px 12px}
.sum-foot{margin-top:8px;font-size:15px;font-weight:700;color:#7a728e}
.result.summary .btn-ok{margin-top:10px}
.play-set{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.play-panel .seg[hidden]{display:none}

/* ===== print (당첨 확인서) ===== */
.sum-btns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.sum-btns .btn-ok{margin-top:0}
.btn-print{height:66px;min-width:150px;padding:0 22px;border-radius:999px;font-size:23px;font-weight:900;color:#2a0e5a;background:#fff;border:3px solid #6d28d9;box-shadow:0 5px 0 #c9b8f0;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-print svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-print:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b8f0}
.pg-head .pg-print{height:44px;background:#fff;border:2px solid #6d28d9;color:#4c1d95}
.pg-head .pg-print svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#printArea{display:none}
#printArea.measure{display:block;position:fixed;left:-10000px;top:0;visibility:hidden}
.pr-sheet{color:#000;background:#fff;font-family:var(--font);font-size:12px;line-height:1.35;box-sizing:border-box}
.pr-sheet *{box-sizing:border-box}
.pr-80{width:80mm;padding:4mm 4mm 5mm}
.pr-58{width:58mm;padding:3mm 3.5mm 4mm;font-size:10.5px}
.pr-A4{width:128mm;margin:0 auto;padding:8mm 10mm;border:1.5px solid #000;font-size:14px}
.pr-brand{display:flex;flex-direction:column;align-items:center;gap:1.5mm;text-align:center}
.pr-brand img{height:11mm;width:auto;max-width:34mm;object-fit:contain;filter:grayscale(1) contrast(1.3)}
.pr-58 .pr-brand img{height:9mm}
.pr-A4 .pr-brand img{height:16mm;max-width:50mm}
.pr-title{font-weight:800;font-size:1.05em}
.pr-h{font-size:1.75em;font-weight:900;text-align:center;letter-spacing:.12em;margin:2mm 0 2mm;padding:1.5mm 0;border-top:2px solid #000;border-bottom:2px solid #000}
.pr-info{width:100%;border-collapse:collapse;margin-bottom:2mm}
.pr-info th{text-align:left;font-weight:700;width:5.5em;padding:.4mm 0;vertical-align:top;white-space:nowrap}
.pr-info td{text-align:right;padding:.4mm 0}
.pr-cust{font-size:1.45em;font-weight:900}
.pr-list{border-top:1px dashed #000;padding-top:1.5mm}
.pr-row{display:flex;align-items:flex-start;gap:2mm;padding:1.2mm 0;border-bottom:1px dotted #000;break-inside:avoid;page-break-inside:avoid}
.pr-badge{flex:0 0 auto;width:7mm;height:7mm;border:1.5px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05em;line-height:1}
.pr-row.lo .pr-badge{border-radius:2mm;font-size:.55em;border-width:2px}
.pr-58 .pr-badge{width:5.8mm;height:5.8mm}
.pr-A4 .pr-badge{width:9mm;height:9mm}
.pr-name{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.pr-name b{font-weight:900}
.pr-name small{display:block;font-size:.85em;color:#000;overflow-wrap:anywhere}
.pr-qty{flex:0 0 auto;font-weight:900;font-size:1.3em;line-height:1.1}
.pr-row.lo .pr-name b{text-decoration:underline}
.pr-empty{padding:3mm 0;text-align:center}
.pr-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:1.5mm;padding-top:1.2mm;border-top:2px solid #000;font-weight:800}
.pr-total b{font-size:1.4em;font-weight:900}
.pr-note{margin-top:1mm;font-size:.9em}
.pr-sign{display:flex;align-items:flex-end;gap:2mm;margin-top:5mm;font-weight:700}
.pr-sign i{flex:1;border-bottom:1px solid #000;height:1.3em}
.pr-foot{margin-top:2.5mm;text-align:center;font-size:.8em}
@media print{
  html.print-receipt,html.print-receipt body{background:#fff!important;height:auto!important;overflow:visible!important}
  html.print-receipt body>*:not(#printArea){display:none!important}
  html.print-receipt #printArea{display:block!important;position:static}
  html.print-receipt .pr-sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ===== prices / slip date ===== */
.w-price{width:118px}
.w-pprice{width:170px}
.inp.won{text-align:right;font-variant-numeric:tabular-nums}
.ps.money{background:#eefaf1}.ps.money b{color:#15803d;font-size:24px}
.pr-when{text-align:center;margin:0 0 2.5mm;padding-bottom:2mm;border-bottom:1px dashed #000}
.pr-when span{display:block;font-size:.85em;font-weight:700;letter-spacing:.1em}
.pr-when b{display:block;font-weight:900;line-height:1.2}
.pr-date{font-size:1.45em}
.pr-time{font-size:1.9em;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.pr-slip{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr-58 .pr-date{font-size:1.35em}
.pr-58 .pr-info th{width:4.8em}
/* ===== Responsive ===== */
@media (orientation:portrait){
  .stage{flex-direction:column}
  .board{flex:0 0 auto;max-height:36vh;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
  .board-head{grid-column:1/-1}
  .board-art{grid-column:1/-1;min-height:220px;max-height:360px}
}
@media (max-width:900px){
  .pb-txt{display:none}
  .pay-btn{padding:0 11px}
  .brand .sub{display:none}
  .stat{min-width:0;padding:4px 10px}
  .stat .val{font-size:26px}
  .logo{height:62px;padding:4px 8px}
  .topbar{gap:10px;padding-left:12px;padding-right:12px}
  .tools{gap:6px}
  .icon-btn{width:46px;height:46px}
  .brand{gap:10px}
  .brand h1{font-size:21px;line-height:1.15;white-space:normal;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

  .stats{order:1;flex:1}
  .tools{order:2}
  .icon-btn{width:44px;height:44px}
  .board{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}

  .topbar{padding:6px 12px}
  .logo{height:50px;padding:4px 8px}
  .stat .val{font-size:22px}
  .stage{padding-top:14px}
  .tier-row{padding:5px 8px}
  .badge{width:38px;height:38px;font-size:19px}
  .thumb{width:38px;height:38px}
}
/* ===== IP home (selection) · layout pattern from SMG STORE 가챠 ===== */
.btn-back{flex:0 0 auto;height:48px;padding:0 14px;border-radius:14px;border:2px solid rgba(196,36,41,.8);background:rgba(60,0,15,.35);color:#c42429;font-weight:900;font-size:16px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-back .ba{font-size:20px;line-height:1}
.btn-back:active{transform:translateY(1px)}
#app.on-home .btn-back,#app.on-home .stage,#app.on-home .stat-rem{display:none}
#app:not(.on-home) #title::before{content:"";display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--theme);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.4);margin:0 .4em 0 .1em;vertical-align:.1em}
.ipe.off{background:#f4f2f8}.ipe.off .ip-card-prev{filter:grayscale(.6);opacity:.7}
.home{display:none;flex:1;min-height:0;overflow:auto;padding:16px 22px 24px;flex-direction:column;align-items:center;-webkit-overflow-scrolling:touch}
#app.on-home .home{display:flex}
.home-hero{text-align:center;margin:10px 0 18px;flex:0 0 auto}
.home-hero h2{font-size:clamp(24px,3.3vw,36px);font-weight:900;letter-spacing:-.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(196,36,41,.35)}
.home-hero h2::before,.home-hero h2::after{content:"★";color:var(--gold);font-size:.7em;margin:0 .5em;vertical-align:.15em}
.home-hero p{margin-top:6px;font-size:16px;color:#e4d6ff;font-weight:700}
.ip-grid{--cols:4;--ch:380px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap,16px);width:100%;max-width:1240px}
.ip-card{position:relative;border-radius:22px;overflow:hidden;text-align:left;color:#fff;height:var(--ch);display:flex;flex-direction:column;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#1a0633) 100%);
  box-shadow:0 0 0 3px rgba(196,36,41,.55),0 10px 0 color-mix(in srgb,var(--c) 50%,#000),0 16px 28px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s}
.ip-card:active{transform:translateY(5px);box-shadow:0 0 0 3px rgba(196,36,41,.7),0 5px 0 color-mix(in srgb,var(--c) 50%,#000),0 8px 16px rgba(0,0,0,.35)}
.ip-card.sold{filter:grayscale(.45);opacity:.78}
.ic-art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:16px 12px 6px;
  background:repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,.09) 0 6deg,transparent 6deg 12deg),radial-gradient(circle at 50% 35%,rgba(255,255,255,.3),transparent 62%)}
.ic-img{max-width:90%;max-height:100%;object-fit:contain;border-radius:14px;background:rgba(255,255,255,.94);padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ic-ph{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.mini-fan{position:relative;width:min(92%,230px);height:min(88%,190px)}
.mini-fan i{position:absolute;left:50%;bottom:6%;width:34%;aspect-ratio:.64;margin-left:-17%;border-radius:8px;transform-origin:50% 100%;transform:rotate(var(--r)) translateY(var(--d));
  background:linear-gradient(180deg,var(--c) 0 26%,#fff 26% 100%);box-shadow:0 0 0 2.5px #fff,0 0 0 4.5px var(--gold),0 6px 12px rgba(0,0,0,.35);display:flex;justify-content:center}
.mini-fan i b{font-style:normal;font-size:clamp(10px,1.1vw,13px);font-weight:900;color:#fff;letter-spacing:.12em;margin-top:6%;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.mini-fan i::after{content:"";position:absolute;left:12%;right:12%;top:40%;bottom:12%;border-radius:6px;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--c) 22%,#fff) 0 5px,#fff 5px 10px)}
.mini-logo{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:clamp(62px,7vw,86px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px var(--gold),0 6px 14px rgba(0,0,0,.4);display:grid;place-items:center;overflow:hidden}
.mini-logo img{width:86%;height:86%;object-fit:contain}
.ic-foot{flex:0 0 auto;padding:12px 14px 15px;background:rgba(20,6,48,.5);backdrop-filter:blur(4px);border-top:3px solid rgba(196,36,41,.6)}
.ic-name{font-size:clamp(20px,2.4vw,28px);font-weight:900;letter-spacing:-.02em;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.ic-meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:14.5px;font-weight:800}
.ic-meta span{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.ic-meta .ic-lo{background:linear-gradient(180deg,#ffe27a,#f0b400);color:#5a3a00}
.ic-sold{position:absolute;z-index:2;top:38%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);background:rgba(17,17,17,.88);color:var(--gold);font-weight:900;font-size:clamp(24px,3vw,34px);letter-spacing:.1em;padding:6px 24px;border-radius:14px;border:4px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap}
.ic-now{position:absolute;z-index:2;top:10px;left:10px;right:10px;text-align:center;background:var(--gold);color:#6b0a1c;font-weight:900;font-size:14px;border-radius:999px;padding:5px 10px;box-shadow:0 3px 0 #080403;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ip-empty{color:#e4d6ff;font-size:18px;font-weight:800;text-align:center;grid-column:1/-1;padding:40px 10px}
.stage .grid-wrap,#gridWrap{--theme:#6d28d9}
/* play dialog IP chips */
.pm-ips{margin:0 0 10px}
.pm-ips-lbl{font-size:14px;font-weight:900;color:#6b6385;margin-bottom:6px;text-align:left}
.pm-ips-row{display:flex;flex-wrap:wrap;gap:8px}
.pm-ips-row button{flex:1 1 150px;min-height:56px;border-radius:14px;border:3px solid #e4dcf7;background:#f6f3fd;color:#2a0e5a;display:flex;align-items:center;gap:8px;padding:6px 12px;text-align:left}
.pm-ips-row button i{flex:0 0 auto;width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c)}
.pm-ips-row button b{font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-ips-row button small{font-size:13px;font-weight:800;color:#6b6385;white-space:nowrap}
.pm-ips-row button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.pm-ips-row button:disabled{opacity:.4}
/* summary / slip IP */
.sum-ip{display:inline-block;align-self:center;padding:4px 18px;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:17px;margin:2px auto 2px;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.pr-ip{text-align:center;font-size:1.3em;font-weight:900;margin:0 0 2mm;letter-spacing:.04em}
/* payout IP filter / tags */
.ip-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.ipf-lbl{font-size:14px;font-weight:900;color:#6b6385;margin-right:2px}
.ip-filter button{height:44px;padding:0 14px;border-radius:999px;border:2px solid #d4c6f0;background:#fff;font-weight:800;font-size:15px;color:#2a0e5a;display:inline-flex;align-items:center;gap:6px}
.ip-filter button.on{background:#2a0e5a;border-color:#2a0e5a;color:#fff}
.ip-filter button i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.ip-filter button em{font-style:normal;background:#e8212e;color:#fff;border-radius:999px;font-size:12px;padding:1px 7px}
.pg-head .pg-ip{font-style:normal;display:inline-block;font-size:13.5px;font-weight:900;color:#fff;background:var(--c);border-radius:8px;padding:3px 10px;text-shadow:0 1px 1px rgba(0,0,0,.25);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* settings: IP picker / IP manage */
.ip-pick{display:flex;flex-wrap:wrap;gap:8px}
.ip-pick button{height:46px;padding:0 16px;border-radius:999px;border:2px solid #d4c6f0;background:#fff;font-weight:800;font-size:15.5px;color:#2a0e5a;display:inline-flex;align-items:center;gap:7px}
.ip-pick button i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.ip-pick button.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.ip-pick button small{font-size:12px;opacity:.8}
.ip-pick button.ghost{border-style:dashed;color:#6d28d9;margin-left:auto}
.ip-dot{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,#fff)}
.ip-price-card{border-left:9px solid var(--c)}
.gs-card{border-left:9px solid var(--c)}
.set-sep{font-size:17px;font-weight:900;color:#4c1d95;padding:10px 4px 0;border-top:2px dashed #cfc3ee;margin-top:6px}
.set-sep small{font-size:13.5px;color:#7a6fa0;margin-left:8px}
.ipe{--c:#888;display:grid;grid-template-columns:auto auto minmax(150px,1fr) auto auto auto;gap:10px 12px;align-items:center;padding:12px;border-radius:16px;background:#fbfaff;border:2px solid #ece7f7;border-left:9px solid var(--c);margin-bottom:10px}
.ipe .order{display:flex;flex-direction:column;gap:4px}
.ipe .order button{width:40px;height:23px;border-radius:7px;background:#ece8f6;font-size:12px;color:#4b4266}
.ipe .order button:disabled{opacity:.35}
.ip-card-prev{position:relative;width:96px;height:64px;border-radius:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 55%,#1a0633));display:flex;align-items:center;justify-content:center;overflow:visible;color:#fff;cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 3px 0 color-mix(in srgb,var(--c) 50%,#000)}
.ip-card-prev input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ip-card-prev img{width:100%;height:100%;object-fit:cover;border-radius:12px;pointer-events:none}

function peersChanged(){ peersUi();
  if(!syncRt.checkPeers) return; syncRt.checkPeers=false;
  try{ var clash=settings.ips.filter(function(ip){ return ip.enabled!==false&&sellersOf(ip.name).on.length; }); if(!clash.length||!$('#settings').classList.contains('show')) return;
    var playing=sessionActive()&&prefs.left>0?prefs.sessIp:null;
    dialog({title:'다른 태블릿과 IP가 겹칩니다',msg:'이 태블릿에서 켜져 있는 IP를 다른 태블릿이 이미 판매 중입니다.\n'+clash.map(function(ip){return '· '+ip.name+' — '+sellersOf(ip.name).on.join(', ');}).join('\n')+'\n\n같은 IP를 두 태블릿에서 팔면 같은 상품이 두 번 팔릴 수 있습니다.\n[이 태블릿에서 끄기]를 누르면 위 IP를 이 태블릿 홈 화면에서 숨깁니다 (판·기록은 그대로).',ok:'이 태블릿에서 끄기',cancel:'그대로 두기'}).then(function(ok){
      if(!ok) return; var off=[], kept=[];
      clash.forEach(function(ip){ if(ip.id===playing){ kept.push(ip.name); return; } ip.enabled=false; off.push(ip.name); if(draft){ var j=draftIpIdx(ip.id); if(j>=0) draft.ips[j].enabled=false; } });
      if(off.length){ saveSettings(); afterIpsChanged(); render(); if(draft) renderSettings(true); }
      toast(off.length?off.join(', ')+' 판매를 이 태블릿에서 껐습니다'+(kept.length?' ('+kept.join(', ')+'은 플레이 중이라 그대로)':''):kept.join(', ')+'은 플레이 중이라 끄지 않았습니다'); });
  }catch(e){}
}
async function sellToggle(ipId,on,el){
  var ii=draftIpIdx(ipId); if(ii<0) return; var dip=draft.ips[ii];
  if(!on){ dip.enabled=false; renderSettings(true); return; }
  var s=sellersOf(dip.name);
  if(s.on.length&&!sellOvr[ipKey(dip.name)]){
    if(el) el.checked=false; dip.enabled=false;
    var ok=await dialog({title:'다른 태블릿에서 판매 중인 IP',msg:'"'+dip.name+'"은(는) 지금 '+s.on.join(', ')+'에서 판매 중입니다.\n같은 IP를 두 태블릿에서 팔면 같은 상품이 두 번 팔릴 수 있습니다 (재고 이중 판매).\n\n그래도 이 태블릿에서 판매하려면 관리자 비밀번호를 입력하세요.',ok:'비밀번호 입력 후 켜기',cancel:'켜지 않기',danger:true});
    if(!ok){ renderSettings(true); return; }
    openPin(function(){ var j=draftIpIdx(ipId); if(j<0||!draft) return; sellOvr[ipKey(draft.ips[j].name)]=1; draft.ips[j].enabled=true; renderSettings(true); toast(draft.ips[j].name+'을(를) 이 태블릿에서도 판매합니다 (겹침 주의)'); });
    return; }
  dip.enabled=true; renderSettings(true);
  if(!peersLive()&&sync.on) toast('인터넷이 끊겨 있어 다른 태블릿과 겹치는지 확인하지 못했습니다');
  else if(s.off.length) dialog({title:'확인해 주세요',msg:'"'+dip.name+'"은(는) 지금 오프라인인 '+s.off.join(', ')+'에도 판매로 설정되어 있습니다.\n두 태블릿에서 함께 팔지 않도록 확인해 주세요.',cancel:null});
}
async function sellSaveGate(){ // newly sold IPs that an online tablet already sells: blocked unless overridden with the PIN
  if(!draft||!peersLive()) return true;
  var bad=draft.ips.filter(function(ip){ if(ip.enabled===false||sellOvr[ipKey(ip.name)]) return false;
    var old=ipById(ip.id); if(old&&old.enabled!==false&&ipKey(old.name)===ipKey(ip.name)) return false; // already selling it before (not new)
    return sellersOf(ip.name).on.length>0; });
  if(!bad.length) return true;
  var ok=await dialog({title:'다른 태블릿에서 판매 중인 IP',msg:bad.map(function(ip){return '· '+ip.name+' — '+sellersOf(ip.name).on.join(', ')+'에서 판매 중';}).join('\n')+'\n\n같은 IP를 두 태블릿에서 팔면 같은 상품이 두 번 팔릴 수 있어 저장하지 않았습니다.\n그래도 저장하려면 관리자 비밀번호를 입력하세요.',ok:'비밀번호 입력 후 저장',cancel:'돌아가기',danger:true});
  if(ok) openPin(function(){ bad.forEach(function(ip){ sellOvr[ipKey(ip.name)]=1; }); saveDraft(); });
  return false;
}
function tabValidate(){ if(!tabDraft) return true; var c=String(tabDraft.code||'').trim().toUpperCase();
  if(c&&!/^[A-Z0-9]{1,3}$/.test(c)){ toast('태블릿 기호는 영문·숫자 1~3자로 넣어 주세요'); return false; }
  if(!String(tabDraft.device||'').trim()){ toast('태블릿 이름을 넣어 주세요'); return false; } return true; }
function tabApply(){ if(!tabDirty()) return; var c=String(tabDraft.code||'').trim().toUpperCase();
  if(sync.on||sync.cfgText||sync.store) ensureDevId(); // keep the database place when renaming
  sync.device=String(tabDraft.device).trim().slice(0,20); sync.code=c; saveSync(); tabDraft={device:sync.device,code:sync.code};
  try{ var dn=document.getElementById('syncDevName'); if(dn) dn.textContent=sync.device; }catch(e){} syncSnapSoon(); }
$('#setBody').addEventListener('input',function(e){ var id=e.target.id; if(id!=='tabName'&&id!=='tabCode') return; if(!tabDraft) tabDraft={device:sync.device,code:sync.code||''};
  if(id==='tabName') tabDraft.device=e.target.value; else { var v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3); if(v!==e.target.value) e.target.value=v; tabDraft.code=v; } });
$('#setBody').addEventListener('change',function(e){ var el=e.target, id=el.getAttribute&&el.getAttribute('data-sell'); if(!id) return; sellToggle(id,el.checked,el); });
if(sync.on) syncStart();
})();
</script>

<script>
/* Nov event: text must never clip — shrink-to-fit any overflowing label */
(function(){
  var SEL='#title,#brandSub,.stat .lbl,.stat .val,.tier-name,.tier-prize,.tier-count,.bh-title,.board-head *,.hint,.cust-reset,.res-head,.res-tier,.res-prize,.res-meta,.res-extra,.btn-ok,.ribbon,.so-stamp,.soldout p,.bn-wordmark,.bn-wordmark span';
  var busyFit=false, q=0;
  function fit(){ q=0; busyFit=true;
    document.querySelectorAll(SEL).forEach(function(e){
      if(!e.offsetWidth) return;
      e.style.fontSize=''; e.style.whiteSpace=''; e.style.letterSpacing='';
      if(e.scrollWidth<=e.clientWidth+1) return;
      var base=parseFloat(getComputedStyle(e).fontSize), f=base;
      while(e.scrollWidth>e.clientWidth+1 && f>base*0.5){ f*=0.94; e.style.fontSize=f+'px'; }
      if(e.scrollWidth>e.clientWidth+1){ e.style.letterSpacing='0'; }
      if(e.scrollWidth>e.clientWidth+1){ e.style.whiteSpace='normal'; e.style.overflowWrap='anywhere'; e.style.lineHeight='1.15'; }
    });
    busyFit=false; }
  function sched(){ if(busyFit||q) return; q=requestAnimationFrame(fit); }
  window.addEventListener('resize',sched); window.addEventListener('load',sched);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(sched);
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true,characterData:true});
  sched();
})();
</script>
