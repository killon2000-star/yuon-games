<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fde7ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="과자 무게 맞추기">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="../css/app.css">
<title>과자 무게 맞추기</title>
</head>
<body data-game="weight" data-base="../">
<div id="bg"></div>
<canvas id="play"></canvas>
<canvas id="fx"></canvas>
<div id="hitFloat"></div>
<div id="app">
  <button id="logo" type="button" aria-label="SMG STORE">
    <img id="logoImg" alt="SMG STORE">
    <span id="logoText" class="fb hide">SMG STORE</span>
  </button>
  <div id="topRight">
    <button id="btnBgm" type="button" class="on" aria-label="music">♪</button>
    <button id="btnFS" type="button" class="hide" aria-label="fullscreen">⛶</button>
    <button id="chipLang" type="button"></button>
  </div>
  <div id="stage">
    <h1 id="title"></h1>
    <p class="help" id="help"></p>
    <div id="hitBadge" class="hide"></div>
    <div id="grid" class="hide">
      
    </div>
    <div id="result" class="hide">
      <div id="tier"></div>
      <div id="prize"></div>
      <div id="meta"></div>
      <div id="fallen" class="hide"></div>
      <button id="next" type="button"></button>
    </div>
    <button id="go" type="button" class=""></button>
    <button id="homeBtn" type="button" class=""></button>
    <p id="iosHint" class="hide"></p>
  </div>
</div>
<div id="pin" class="ov hide">
  <div class="card" style="text-align:center">
    <h2 id="pinTitle"></h2>
    <div id="pinShow">••••</div>
    <div class="pinErr" id="pinErr"></div>
    <div class="pad" id="pad"></div>
    <div class="row"><button class="btn" type="button" id="pinCancel"></button></div>
  </div>
</div>
<div id="admin" class="ov hide">
  <div class="card">
    <h2 id="adTitle"></h2>
    <div class="srow"><span id="lbStaff">다음 참가자 확인</span><button class="tg" type="button" id="tgStaff"></button></div>
    <div class="srow"><span id="lbFsStart">시작 시 전체화면</span><button class="tg" type="button" id="tgFsStart"></button></div>
    <div class="srow"><span id="lbSfx">효과음</span><button class="tg" type="button" id="tgSfx"></button></div>
    <div class="srow"><span id="lbVib">진동</span><button class="tg" type="button" id="tgVib"></button></div>
    <div class="srow"><span id="lbMusic">음악</span><button class="tg" type="button" id="tgMusic"></button></div>
    <div class="srow"><span id="lbVol">음량</span><input id="inVol" type="range" min="0" max="100" step="5"></div>
    <div class="srow"><span id="lbPin">비밀번호 4자리</span><input id="inPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"></div>
    <div class="srow"><span id="lbShared">상품 재고 공유</span><button class="tg" type="button" id="tgShared"></button></div>
    <h2 style="margin-top:16px">정확히 맞춘 사람</h2>
    <p class="muted" id="hitsHint">1등(정확한 히트)만 세고, 참가자 화면에도 보입니다.</p>
    <div id="hitsBox"></div>
    <div class="row"><button class="btn warn" type="button" id="adHits">횟수 초기화</button></div>
    <h2 id="lbPrizes" style="margin-top:16px">상품·기준</h2>
    <div class="tabs" id="gameTabs">
      <button class="tab on" type="button" data-g="center">정중앙</button>
      <button class="tab" type="button" data-g="stack">탑 쌓기</button>
      <button class="tab" type="button" data-g="weight">무게</button>
      <button class="tab" type="button" data-g="jump">점프</button>
      <button class="tab" type="button" data-g="crane">크레인</button>
    </div>
    <p class="muted" id="prizeHint"></p>
    <table class="ptable" id="pTable"><thead><tr><th></th><th>상품명</th><th>기준</th><th>재고</th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:10px">
      <button class="btn ok" type="button" id="adSave"></button>
      <button class="btn" type="button" id="adClose"></button>
    </div>
  </div>
</div>
<script src="../js/logic.js"></script>
<script src="../js/draw.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/games.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
