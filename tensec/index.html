<style>

.tg.on{background:var(--btn);color:var(--ink)}
.btn{border-radius:24px;padding:12px 22px;margin:6px;font-size:16px;font-weight:800;color:var(--ink);background:var(--btn3);border:4px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:inherit;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ok{background:var(--btn)}.btn.warn{background:var(--stop)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}

#pinShow{font-size:36px;letter-spacing:.4em;font-weight:900;min-height:48px;text-align:center}

@media (orientation:landscape) and (max-height:520px){
  .help{font-size:13px;max-width:20em}
  #stage{flex-direction:row;gap:18px;justify-content:space-evenly}
  #capy{width:min(140px,22vw);max-height:70vh}
  h1{font-size:clamp(22px,5vmin,36px)}
  #go{width:min(160px,28vw);height:min(160px,28vw);max-width:56vh;max-height:56vh;font-size:clamp(24px,6vmin,36px);margin:0}
  #clock{font-size:clamp(48px,16vmin,96px)}

  #prize{font-size:clamp(28px,8vmin,56px)}
  .landCol{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
}
@media (min-width:700px) and (min-height:700px){
  #capy{width:240px}
  #go{width:240px;height:240px}
}
.low .pulse{animation:none}
</style>

<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<div id="app">

  <button id="chipLang" type="button"></button>
  <div id="stage">
    <div class="landCol">
      <canvas id="capy" width="300" height="240"></canvas>
      <h1 id="title"></h1>
      <p class="help" id="help"></p>

        <div id="clock">0.00</div>
        <div id="hintHide"><div class="pulse"></div><span id="hideMsg"></span></div>
      </div>
      <div id="result" class="hide">
        <div id="tier"></div>
        <div id="prize"></div>
        <div id="meta"></div>
        <div id="fallen" class="hide"></div>

    </div>
  </div>
</div>
<div id="pin" class="ov hide">
  <div class="card" style="text-align:center">

    <div class="pad" id="pad"></div>
    <div class="row"><button class="btn" type="button" id="pinCancel"></button></div>
  </div>
</div>
<div id="admin" class="ov hide">
  <div class="card">
    <h2 id="adTitle"></h2>
    <div class="srow"><span id="lbHide"></span><button class="tg" type="button" id="tgHide"></button></div>
    <div class="srow"><span id="lbHideSec"></span><input id="inHideSec" type="number" min="1" max="9" step="0.5"></div>
    <div class="srow"><span id="lbStaff"></span><button class="tg" type="button" id="tgStaff"></button></div>
    <div class="srow"><span id="lbSfx"></span><button class="tg" type="button" id="tgSfx"></button></div>
    <div class="srow"><span id="lbVib"></span><button class="tg" type="button" id="tgVib"></button></div>
    <div class="srow"><span id="lbPin"></span><input id="inPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" autocomplete="off"></div>
    <h2 id="lbPrizes" style="margin-top:16px"></h2>
    <p class="muted" id="prizeHint"></p>
    <table class="ptable" id="pTable"><thead></thead><tbody></tbody></table>
    <h2 id="lbLog" style="margin-top:16px"></h2>
    <div id="sum" class="muted"></div>
    <div id="logBox"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ok" type="button" id="adSave"></button>
      <button class="btn" type="button" id="adCsv"></button>
      <button class="btn warn" type="button" id="adReset"></button>
      <button class="btn" type="button" id="adClose"></button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var TARGET=10, LS_CFG='tensec_cfg', LS_LOG='tensec_log', AUTO_STOP=30;
var LOW=/[?&]low=1/.test(location.search)||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
if(LOW) document.body.classList.add('low');
var LANGS=['ko','en','id'];
var I18N={
ko:{title:'10초 맞추기',help:'시작을 누른 뒤, 마음속으로 10초를 세고 정지를 누르세요. 숫자는 잠시 후 사라집니다.',start:'시작',stop:'정지',next:'다음 참가자',again:'다시 하기',hideMsg:'이제 감각으로!',rec:'기록',errFast:'초 빠름',errSlow:'초 느림',errExact:'정확해요!',tier:['참가상','1등','2등','3등','4등'],stockLeft:'남은 수량',fallen:'재고가 없어 아래 등급으로 지급되었습니다',soldOut:'상품이 모두 소진되었습니다',pinTitle:'관리자',pinWrong:'비밀번호가 달라요',cancel:'취소',adTitle:'이벤트 설정',lbHide:'타이머 숨기기',lbHideSec:'숨기는 시간(초)',lbStaff:'다음 참가자 확인',lbSfx:'효과음',lbVib:'진동',lbPin:'비밀번호 4자리',lbPrizes:'상품·오차 기준',prizeHint:'오차는 절대값(초). 재고를 비우면 무제한. 재고 0이면 아래 등급으로 내려갑니다.',lbLog:'참가 기록',thName:'상품명',thErr:'오차 ≤',thStock:'재고',save:'저장',csv:'CSV 저장',resetLog:'기록 지우기',close:'닫기',on:'켜짐',off:'꺼짐',sum:'회',confirmReset:'참가 기록을 모두 지울까요?',saved:'저장했습니다',langName:'한국어'},
en:{title:'Hit 10 Seconds',help:'Press Start, count to 10 in your head, then press Stop. The timer hides after a moment.',start:'START',stop:'STOP',next:'Next player',again:'Play again',hideMsg:'Feel the time!',rec:'Time',errFast:'s early',errSlow:'s late',errExact:'Perfect!',tier:['Thanks','1st','2nd','3rd','4th'],stockLeft:'Left',fallen:'This prize was out of stock, so the next prize was given',soldOut:'All prizes are gone',pinTitle:'Staff',pinWrong:'Wrong PIN',cancel:'Cancel',adTitle:'Event settings',lbHide:'Hide the timer',lbHideSec:'Hide after (sec)',lbStaff:'Staff must confirm next',lbSfx:'Sound',lbVib:'Vibration',lbPin:'4-digit PIN',lbPrizes:'Prizes & error limits',prizeHint:'Error is absolute seconds. Leave stock blank for unlimited. Stock 0 falls to the next prize.',lbLog:'Play log',thName:'Prize',thErr:'Error ≤',thStock:'Stock',save:'Save',csv:'Export CSV',resetLog:'Clear log',close:'Close',on:'ON',off:'OFF',sum:'plays',confirmReset:'Clear the whole play log?',saved:'Saved',langName:'English'},
id:{title:'Tebak 10 Detik',help:'Tekan Mulai, hitung 10 detik dalam hati, lalu tekan Berhenti. Angka akan hilang sebentar lagi.',start:'MULAI',stop:'BERHENTI',next:'Peserta berikut',again:'Main lagi',hideMsg:'Rasakan waktunya!',rec:'Waktu',errFast:' dtk lebih cepat',errSlow:' dtk lebih lambat',errExact:'Tepat sekali!',tier:['Hadiah trobosan','Juara 1','Juara 2','Juara 3','Juara 4'],stockLeft:'Sisa',fallen:'Stok habis, hadiah tingkat berikutnya diberikan',soldOut:'Semua hadiah habis',pinTitle:'Staf',pinWrong:'PIN salah',cancel:'Batal',adTitle:'Pengaturan acara',lbHide:'Sembunyikan timer',lbHideSec:'Sembunyi setelah (dtk)',lbStaff:'Staf konfirmasi peserta berikut',lbSfx:'Suara',lbVib:'Getar',lbPin:'PIN 4 digit',lbPrizes:'Hadiah & batas selisih',prizeHint:'Selisih dalam detik mutlak. Kosongkan stok untuk tak terbatas. Stok 0 turun ke hadiah berikutnya.',lbLog:'Catatan main',thName:'Hadiah',thErr:'Selisih ≤',thStock:'Stok',save:'Simpan',csv:'Unduh CSV',resetLog:'Hapus catatan',close:'Tutup',on:'NYALA',off:'MATI',sum:'kali',confirmReset:'Hapus semua catatan?',saved:'Tersimpan',langName:'Bahasa Indonesia'}
};
function detectLang(){
  var q=/[?&]lang=(en|id|ko)/.exec(location.search);if(q)return q[1];
  try{var s=JSON.parse(localStorage.getItem(LS_CFG)||'{}');if(s.lang&&LANGS.indexOf(s.lang)>=0)return s.lang}catch(e){}
  var ls=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'ko'];
  for(var i=0;i<ls.length;i++){var l=(ls[i]||'').toLowerCase();if(/^(id|in|ms)\b/.test(l))return'id';if(/^ko\b/.test(l))return'ko';if(/^en\b/.test(l))return'en'}
  return'ko';
}
function defaultCfg(){
  return{pin:'0000',hideTimer:true,hideAfterSec:3,staffReset:true,sfx:true,vib:true,lang:'',
    prizes:[
      {name:'1등 상품',maxErr:0.005,stock:null},
      {name:'2등 상품',maxErr:0.05,stock:null},
      {name:'3등 상품',maxErr:0.20,stock:null},
      {name:'4등 상품',maxErr:0.50,stock:null},
      {name:'참가상',maxErr:Infinity,stock:null}
    ]};
}
function absErr(t){return Math.abs(Number(t)-TARGET)}
function toMs(v){return Math.round(Number(v)*1000)}
function inStock(p){if(!p)return false;if(p.stock==null||p.stock==='')return true;var n=Number(p.stock);return !isFinite(n)||n>0}
function pickTierIndex(err,prizes){
  var e=toMs(err);
  for(var i=0;i<prizes.length;i++){var m=prizes[i].maxErr;if(m==null||!isFinite(Number(m))||e<=toMs(m))return i}
  return prizes.length-1;
}
function awardPrize(elapsed,cfg){
  var err=absErr(elapsed),prizes=cfg.prizes,want=pickTierIndex(err,prizes),i=want;
  while(i<prizes.length){
    if(inStock(prizes[i]))return{index:i,prize:prizes[i],err:err,elapsed:elapsed,fallen:i!==want,soldOut:false};
    i++;
  }
  return{index:-1,prize:{name:'상품 소진',maxErr:Infinity,stock:0},err:err,elapsed:elapsed,fallen:true,soldOut:true};
}
function applyAward(elapsed,cfg,log){
  var a=awardPrize(elapsed,cfg);
  if(!a.soldOut&&a.prize&&a.prize.stock!=null&&a.prize.stock!==''&&isFinite(Number(a.prize.stock))){
    a.prize.stock=Number(a.prize.stock)-1;if(a.prize.stock<0)a.prize.stock=0;
  }
  log.push({t:elapsed,err:a.err,index:a.index,prize:a.prize.name,fallen:!!a.fallen,soldOut:!!a.soldOut,at:Date.now()});
  if(log.length>800)log.splice(0,log.length-800);
  return a;
}
function mergeCfg(raw){
  var d=defaultCfg();if(!raw||typeof raw!=='object')return d;
  if(typeof raw.pin==='string'&&/^\d{4}$/.test(raw.pin))d.pin=raw.pin;
  d.hideTimer=!!raw.hideTimer;if(raw.hideTimer===false)d.hideTimer=false;
  var hs=Number(raw.hideAfterSec);if(isFinite(hs)&&hs>=1&&hs<=9)d.hideAfterSec=hs;
  d.staffReset=raw.staffReset!==false;
  d.sfx=raw.sfx!==false;d.vib=raw.vib!==false;
  if(raw.lang&&LANGS.indexOf(raw.lang)>=0)d.lang=raw.lang;
  if(Array.isArray(raw.prizes)&&raw.prizes.length>=5){
    for(var i=0;i<5;i++){
      var p=raw.prizes[i]||{},q=d.prizes[i];
      if(typeof p.name==='string'&&p.name.trim())q.name=p.name.trim().slice(0,40);
      if(i<4){var m=Number(p.maxErr);if(isFinite(m)&&m>=0&&m<=10)q.maxErr=m}
      if(p.stock==null||p.stock==='')q.stock=null;
      else{var s=Number(p.stock);q.stock=isFinite(s)&&s>=0?Math.floor(s):null}
    }
  }
  return d;
}
function loadCfg(){try{return mergeCfg(JSON.parse(localStorage.getItem(LS_CFG)||'null'))}catch(e){return defaultCfg()}}
function saveCfg(c){try{localStorage.setItem(LS_CFG,JSON.stringify(c))}catch(e){}}
function loadLog(){try{var a=JSON.parse(localStorage.getItem(LS_LOG)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
function saveLog(a){try{localStorage.setItem(LS_LOG,JSON.stringify(a))}catch(e){}}

function fmtTime(t){
  var sign=t<0?'-':'';
  var ms=Math.round(Math.abs(t)*1000);
  var third=ms%10;
  var cs=Math.floor(ms/10);
  var sec=Math.floor(cs/100), hun=cs%100;
  return{sign:sign,main:sign+sec+'.'+(hun<10?'0':'')+hun,third:String(third),ms:ms};

var AC=null;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(freq,dur,type,gain,at){
  var a=audio();if(!a||!cfg.sfx)return;
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(at||0);
  o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function sfxStart(){tone(523,0.09,'triangle',0.08);tone(784,0.12,'triangle',0.07,0.07)}
function sfxStop(){tone(392,0.06,'square',0.05)}
function sfxWin(idx){
  if(idx<0||idx>=4){tone(247,0.14,'sine',0.06);tone(196,0.22,'sine',0.05,0.12);return}
  var seq=idx===0?[[523,.12],[659,.12],[784,.12],[1046,.28]]:idx===1?[[523,.1],[659,.1],[784,.22]]:[[392,.1],[523,.18]];
  for(var i=0;i<seq.length;i++)tone(seq[i][0],seq[i][1],'triangle',0.1,i*0.11);
}

function burst(kind){
  bits=[];if(LOW&&kind!=='gold') {for(var i=0;i<18;i++)spawn(kind); } else {var n=kind==='gold'?90:kind==='soft'?36:60;for(var j=0;j<n;j++)spawn(kind)}
  if(!fxR)fxR=requestAnimationFrame(tickFx);
}
function spawn(kind){
  var cols=kind==='gold'?['#ffd76a','#fff1a8','#ff8fab','#fff','#9be3b0']:kind==='soft'?['#e8d5c8','#ffd59e','#cfd8ff']:['#ff8fab','#ffd59e','#9be3b0','#cfd8ff','#fff'];
  bits.push({x:innerWidth*(.2+Math.random()*.6),y:-16-Math.random()*40,v:2+Math.random()*5,vx:(Math.random()-.5)*5,w:6+Math.random()*8,h:8+Math.random()*10,rot:Math.random()*6,vr:(Math.random()-.5)*.3,col:cols[Math.floor(Math.random()*cols.length)]});
}
function tickFx(){
  fxx.clearRect(0,0,innerWidth,innerHeight);
  var live=0;
  for(var i=0;i<bits.length;i++){
    var b=bits[i];if(!b)continue;b.y+=b.v;b.x+=b.vx;b.v+=0.08;b.rot+=b.vr;
    if(b.y>innerHeight+20){bits[i]=null;continue}live++;
    fxx.save();fxx.translate(b.x,b.y);fxx.rotate(b.rot);fxx.fillStyle=b.col;fxx.fillRect(-b.w/2,-b.h/2,b.w,b.h);fxx.restore();
  }
  if(live)fxR=requestAnimationFrame(tickFx);else{fxR=0;fxx.clearRect(0,0,innerWidth,innerHeight)}

function startRun(ev){
  if(ev){ev.preventDefault();ev.stopPropagation()}
  audio();
  t0=performance.now();mode='run';hidden=false;
  $('result').classList.add('hide');$('title').classList.add('hide');$('help').classList.add('hide');
  $('go').classList.remove('hide');$('go').classList.add('stop');$('go').textContent=t('stop');
  $('clock').className='';$('clock').textContent='0.00';$('hintHide').classList.remove('on','snap');
  drawCapy(0,true);sfxStart();vibe(18);keepOn(true);
  if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function tick(){
  if(mode!=='run')return;
  var el=(performance.now()-t0)/1000;
  if(el>=AUTO_STOP){finish(AUTO_STOP);return}
  if(cfg.hideTimer&&el>=cfg.hideAfterSec){
    if(!hidden){hidden=true;$('clock').classList.remove('gone');$('clock').classList.add('fade');$('hintHide').classList.remove('snap');$('hintHide').classList.add('on');
      setTimeout(function(){if(mode==='run'&&hidden)$('clock').classList.add('gone')},480);drawCapy(0,true)}
  }else{
    $('clock').className='';$('clock').textContent=fmtTime(el).main;$('hintHide').classList.remove('on','snap');
  }
  raf=requestAnimationFrame(tick);
}
function stopRun(ev){
  if(ev){ev.preventDefault();ev.stopPropagation()}
  if(mode!=='run')return;
  finish((performance.now()-t0)/1000);
}
function finish(elapsed){
  if(raf){cancelAnimationFrame(raf);raf=0}
  mode='result';keepOn(false);
  var a=applyAward(elapsed,cfg,log);lastAward=a;saveCfg(cfg);saveLog(log);
  renderResult(a);sfxStop();sfxWin(a.index);
  if(a.index===0){burst('gold');vibePat([40,40,80,40,80])}
  else if(a.index>=1&&a.index<=3){burst('ok');vibe(50)}
  else{burst('soft');vibe(20)}
}

  $('tier').textContent=rank;
  $('prize').className=(a.soldOut||a.index<0||a.index>=4)?'t0':('t'+(a.index+1));
  $('prize').textContent=a.soldOut?t('soldOut'):a.prize.name;
  var dir=a.elapsed<TARGET?t('errFast'):a.elapsed>TARGET?t('errSlow'):t('errExact');
  var line=t('rec')+' '+f.main+f.third+'s  ·  ';
  if(a.err<0.0005)line+=t('errExact');else line+='Δ '+fmtErr(a.err)+dir;

}

  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='10초맞추기_기록.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

}

['pointerup','pointercancel','pointerleave'].forEach(function(ev){$('logo').addEventListener(ev,lpClear)});

$('adCsv').addEventListener('click',exportCSV);

  navigator.serviceWorker.register('sw.js');

window.__ts={
  TARGET:TARGET, defaultCfg:defaultCfg, mergeCfg:mergeCfg, absErr:absErr, toMs:toMs, inStock:inStock,
  pickTierIndex:pickTierIndex, awardPrize:awardPrize, applyAward:applyAward, fmtTime:fmtTime,
  get cfg(){return cfg}, set cfg(v){cfg=mergeCfg(v)}, get log(){return log}, set log(v){log=v},
  get mode(){return mode}, get lang(){return lang}, get hidden(){return hidden}, get lastAward(){return lastAward},

    if(hide){$('clock').className='gone';$('clock').textContent=fmtTime(elapsed).main;$('hintHide').classList.remove('snap');$('hintHide').classList.add('on');drawCapy(0,true)}
    else{$('clock').className='';$('clock').textContent=fmtTime(elapsed).main;$('hintHide').classList.remove('on','snap');drawCapy(0,false)}
    keepOn(true);
  },

  setLang:function(l){if(LANGS.indexOf(l)>=0){lang=l;cfg.lang=l;applyLang()}}
