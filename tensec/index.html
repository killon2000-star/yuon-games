<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fde7ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="10초 맞추기">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>10초 맞추기</title>
<style>
:root{--bg:#fde7ef;--ink:#5b4636;--card:#fff;--btn:#9be3b0;--stop:#ff9aa8;--btn2:#ffd59e;--btn3:#cfd8ff;--title:#ff8fab;--chip:#ffe3ef;--line:#5b4636;--gold:#ffd76a;--miss:#e8d5c8;--ov:rgba(255,240,246,.96);--chrome-h:76px}
html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;height:100dvh;height:var(--app-h,100dvh);overflow:hidden;background:var(--bg);overscroll-behavior:none;overscroll-behavior-y:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Noto Sans CJK KR","Noto Sans CJK SC","Noto Sans CJK JP","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
#bg,#fx,#app{position:fixed;left:0;right:0;top:var(--app-top,0);width:100%;height:100%;height:var(--app-h,100dvh);box-sizing:border-box}
#bg{pointer-events:none;background:
 radial-gradient(ellipse at 20% 10%,#fff6c8 0%,transparent 50%),
 radial-gradient(ellipse at 90% 80%,#d9ecff 0%,transparent 45%),
 radial-gradient(ellipse at 10% 90%,#ffd6e8 0%,transparent 40%),
 var(--bg)}
#fx{pointer-events:none;z-index:0}
#app{display:flex;flex-direction:column;align-items:center;padding:0 max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));z-index:1}
#scene{position:fixed;left:0;right:0;top:var(--app-top,0);width:100%;height:var(--app-h,100dvh);z-index:0;pointer-events:auto}
#app{pointer-events:none;background:transparent}
 #app button,#app input,#app table,#app .ov,#app .card,#app #chipLang,#app #clockWrap,#app #result,#app #iosHint,#app #prizeRow,#app #entryGate,#app #entryCatch,#pin,#admin{pointer-events:auto}
#logo{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:25;background:#fff;border:3px solid var(--line);border-radius:16px;padding:4px 8px;font-family:inherit;box-shadow:0 3px 0 var(--line);line-height:0}
#logo img{display:block;height:44px;width:auto;max-width:168px}
#logo:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#topRight{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));z-index:25;display:flex;gap:8px;align-items:center;pointer-events:auto}
#chipLang,#btnFS,#btnMusic{background:var(--chip);border:3px solid var(--line);border-radius:16px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink);font-family:inherit;box-shadow:0 3px 0 var(--line)}
#btnFS,#btnMusic{width:42px;height:42px;padding:0;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
#btnMusic.off{background:#eee;opacity:.85}
#btnFS:active,#chipLang:active,#btnMusic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#btnFS.on{background:var(--btn)}
#iosHint{margin:10px 8px 0;max-width:22em;font-size:13px;font-weight:700;line-height:1.35;opacity:.85;text-align:center}
#stage{flex:1;width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;min-height:0;padding-top:var(--chrome-h);pointer-events:none}
#stage > *{pointer-events:none}
#stage button,#stage #clockWrap,#stage #result,#stage #prizeRow,#stage #iosHint,#dock{pointer-events:auto}
.hud{position:relative;flex:0 0 auto;width:100%;z-index:6}
#dock{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;flex:0 0 auto;z-index:6;padding:10px 8px 4px;box-sizing:border-box;background:linear-gradient(180deg,rgba(253,231,239,0) 0%,rgba(253,231,239,.82) 36%,rgba(243,215,196,.95) 100%)}
h1{font-size:clamp(28px,7.2vmin,52px);margin:4px 0 6px;color:var(--title);-webkit-text-stroke:2px var(--line);paint-order:stroke fill;text-shadow:0 4px 0 var(--line);line-height:1.15;font-weight:900}
.help{margin:0 0 8px;font-weight:700;opacity:.9;font-size:clamp(14px,3.6vmin,18px);max-width:28em;line-height:1.4}
#ruleHint{display:none;pointer-events:none;position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);margin:0;width:max-content;max-width:min(94vw,20em);padding:12px 22px;border-radius:24px;border:4px solid var(--line);background:#fff;box-shadow:0 5px 0 var(--line);color:var(--ink);font-weight:900;font-size:clamp(26px,7vmin,44px);line-height:1.25;letter-spacing:-0.02em;text-align:center;word-break:keep-all;overflow-wrap:anywhere;z-index:6;box-sizing:border-box}
#ruleHint.on{display:block;animation:rulein .55s ease both}
#ruleHint b{color:var(--title);font-size:1.08em;-webkit-text-stroke:1px var(--line);paint-order:stroke fill}
@keyframes rulein{0%{opacity:0;transform:translateX(-50%) translateY(14px) scale(.9)}62%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1.05)}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.low #ruleHint.on{animation:none;transform:translateX(-50%)}
#clockWrap #hintHide{opacity:0!important;pointer-events:none}
#clockWrap{position:relative;min-height:clamp(64px,14vmin,120px);display:flex;align-items:center;justify-content:center;width:100%;max-width:100%;margin:2px 0;box-sizing:border-box;overflow:hidden;padding:0 4px}
#clock{display:flex;align-items:flex-start;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:clamp(52px,14vmin,108px);letter-spacing:0;line-height:1;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.7);max-width:100%;width:100%;min-width:0;box-sizing:border-box}
#clock .third{font-size:.36em;margin-left:3px;margin-top:.12em;opacity:.75;font-weight:700;line-height:1}
#clock .unit{font-size:.32em;margin-left:6px;margin-top:.22em;font-weight:800;opacity:.9;line-height:1;flex:0 0 auto}
#clock.fade{opacity:0;transition:opacity .45s ease}
#clock.gone{opacity:0;visibility:hidden;transition:none}
#clock.big{font-size:clamp(92px,18vmin,168px);text-shadow:0 4px 0 rgba(255,255,255,.75)}
#clockWrap.reveal{min-height:clamp(140px,28vmin,240px);flex-direction:column}
#recLabel{font-weight:900;font-size:clamp(18px,4.2vmin,28px);margin:0 0 2px;letter-spacing:.04em;opacity:.88;color:var(--ink)}
#recLabel.hide{display:none!important}
#hintHide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:clamp(18px,5vmin,28px);opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:2}
#hintHide.on{opacity:1}
#hintHide.snap{transition:none;opacity:0}
.pulse{width:88px;height:88px;border-radius:50%;border:6px solid var(--title);box-shadow:0 0 0 0 rgba(255,143,171,.55);animation:pulse 1.4s ease-out infinite;margin-bottom:10px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,143,171,.5);transform:scale(.92)}70%{box-shadow:0 0 0 22px rgba(255,143,171,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(255,143,171,0);transform:scale(.92)}}
#go{border-radius:50%;width:min(150px,40vw);height:min(150px,40vw);max-width:20vh;max-height:20vh;margin:8px 0 4px;font-size:clamp(26px,6.5vmin,40px);font-weight:900;color:var(--ink);background:var(--btn);border:6px solid var(--line);box-shadow:0 8px 0 var(--line);font-family:inherit;touch-action:manipulation;line-height:1;letter-spacing:.04em;z-index:6;flex:0 0 auto}
#go:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
#go.stop{background:var(--stop)}
#go.hide,#stage .hide, .hide{display:none!important}
#result{width:min(520px,94%);display:flex;flex-direction:column;align-items:center}
#tier{font-size:clamp(22px,5.5vmin,34px);font-weight:900;margin:2px 0}
#prizeRow{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:100%}
#prizeIcon{width:72px;height:72px;flex:0 0 auto}
#prize{font-size:clamp(20px,4.4vmin,36px);font-weight:900;line-height:1.15;margin:4px 0 8px;padding:8px 14px;border-radius:20px;border:5px solid var(--line);background:var(--gold);box-shadow:0 6px 0 var(--line);max-width:100%;box-sizing:border-box;white-space:nowrap;word-break:keep-all;overflow:hidden;color:var(--ink)}
#prize.t0{background:var(--miss)}
#prize.t1{background:#ffd76a}
#prize.t2{background:#e8e8f8}
#prize.t3{background:#e8b892}
#prize.t4{background:#b8f0d0}
#meta{font-weight:800;font-size:clamp(16px,4vmin,22px);margin:2px 0}
#meta .err{color:#c45b7a}
#fallen{font-size:14px;font-weight:700;opacity:.85;margin:4px 0 0;max-width:26em}
#next{border-radius:28px;padding:16px 28px;margin:14px 0 0;font-size:clamp(18px,4.8vmin,24px);font-weight:800;color:var(--ink);background:var(--btn2);border:4px solid var(--line);box-shadow:0 5px 0 var(--line);min-width:min(260px,80vw);font-family:inherit;touch-action:manipulation}
#next:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--ov);padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));text-align:center;box-sizing:border-box;overflow:auto;-webkit-overflow-scrolling:touch;z-index:30}
.card{background:var(--card);border:4px solid var(--line);border-radius:22px;padding:16px 18px;margin:8px auto;font-weight:700;width:min(520px,94vw);box-sizing:border-box;text-align:left}
.card h2{margin:0 0 10px;font-size:22px;text-align:center}
.srow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px;font-size:16px}
.srow input[type=text],.srow input[type=number],.srow input[type=password]{flex:1;min-width:0;padding:8px 10px;border-radius:12px;border:3px solid var(--line);font:inherit;font-weight:700;color:var(--ink);background:#fff}
.tg{min-width:84px;padding:8px 12px;border-radius:18px;border:3px solid var(--line);background:#eee;color:#555;font-weight:800;font-size:15px;font-family:inherit}
.tg.on{background:var(--btn);color:var(--ink)}
.btn{border-radius:24px;padding:12px 22px;margin:6px;font-size:16px;font-weight:800;color:var(--ink);background:var(--btn3);border:4px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:inherit;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.ok{background:var(--btn)}.btn.warn{background:var(--stop)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(320px,86vw);margin:12px auto}
.pad button{height:64px;border-radius:18px;border:4px solid var(--line);background:#fff;font-size:26px;font-weight:900;font-family:inherit;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#pinShow{font-size:36px;letter-spacing:.4em;font-weight:900;min-height:48px;text-align:center}
.pinErr{color:#c45b7a;min-height:1.2em;text-align:center;font-weight:800}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th,.ptable td{border-bottom:2px solid #f0dce4;padding:6px 4px;text-align:left;vertical-align:middle}.ptable td:first-child,.ptable th:first-child{white-space:nowrap;font-weight:800;padding-right:8px}
.ptable input{width:100%;padding:6px 8px;border-radius:10px;border:2px solid var(--line);font:inherit;font-weight:700;box-sizing:border-box}
#logBox{max-height:30vh;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:6px;background:#fffafc;font-size:13px}
.muted{opacity:.75;font-size:13px;text-align:center;margin:6px 0 0}
@media (orientation:landscape){
  .help{font-size:13px;max-width:22em}
  #stage{flex-direction:row;gap:12px;justify-content:flex-end;align-items:stretch;padding-top:0;max-width:none}
  .hud{position:absolute;left:0;right:calc(min(480px,40%) + 4%);width:auto;max-width:none;top:var(--chrome-h);text-align:center;box-sizing:border-box;padding:0 8px}
  h1{font-size:clamp(22px,5vmin,40px)}
  #dock{width:min(480px,40%);margin:var(--chrome-h) 2% 0 0;justify-content:center;align-self:stretch;max-height:calc(100% - var(--chrome-h));box-sizing:border-box;background:linear-gradient(90deg,rgba(253,231,239,0) 0%,rgba(253,231,239,.78) 18%,rgba(243,215,196,.92) 100%);padding:12px 16px}
  #go{width:min(140px,20vw);height:min(140px,20vw);max-width:32vh;max-height:32vh;font-size:clamp(22px,5vmin,36px);margin:4px 0}
  #clock{font-size:clamp(48px,10vmin,96px)}
  #clock.big{font-size:clamp(56px,9.2vmin,112px)}
  #clockWrap{min-height:clamp(56px,14vmin,110px)}
  #clockWrap.reveal{min-height:clamp(96px,22vmin,160px)}
  #prize{font-size:clamp(18px,3.2vmin,30px);white-space:nowrap}
  .landCol{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;pointer-events:none}
  .landCol > *{pointer-events:auto}
}
@media (orientation:landscape) and (min-width:1000px){
  /* Galaxy Tab landscape ~1280x800 */
  #logo img{height:52px;max-width:200px}
  #go{width:min(200px,18vw);height:min(200px,18vw);max-width:34vh;max-height:34vh;font-size:clamp(28px,5vmin,44px)}
  #clock{font-size:clamp(56px,9vmin,104px)}
  #clock.big{font-size:clamp(64px,9.4vmin,124px)}
  #hits{font-size:clamp(18px,2.4vw,26px);padding:10px 22px}
  #next{font-size:22px;padding:18px 32px;min-width:280px}
}
@media (min-width:700px) and (min-height:1000px){
  /* Galaxy Tab portrait ~800x1280 */
  #logo img{height:52px;max-width:200px}
  #go{width:min(200px,36vw);height:min(200px,36vw);max-width:20vh;max-height:20vh;font-size:clamp(28px,5vmin,44px)}
  #clock{font-size:clamp(64px,12vmin,120px)}
  #clock.big{font-size:clamp(96px,16vmin,168px)}
  #hits{font-size:clamp(18px,3.2vw,26px);padding:10px 22px}
}
@media (max-aspect-ratio: 3/4) and (max-width:699px){
  #clock{font-size:clamp(44px,12vmin,80px)}
  #clockWrap{min-height:clamp(52px,12vmin,96px)}
  #go{width:min(120px,28vw);height:min(120px,28vw);max-width:16vh;max-height:16vh}
}
.low .pulse{animation:none}
#hitsWrap{position:relative;z-index:6;margin:6px 0 2px;pointer-events:none;flex:0 0 auto;display:inline-block}
#hits{display:inline-block;background:#fff;border:3px solid var(--line);border-radius:22px;padding:8px 18px;font-weight:800;font-size:clamp(16px,4.4vmin,24px);box-shadow:0 3px 0 var(--line);color:var(--ink)}
#hits b{color:var(--title);font-size:1.25em;-webkit-text-stroke:1px var(--line);paint-order:stroke fill}
#hitsPlus{position:absolute;left:calc(100% + 10px);top:50%;margin-left:0;transform:translateY(-50%);font-weight:900;color:#ff8fab;font-size:clamp(22px,5vmin,32px);opacity:0;pointer-events:none;text-shadow:0 2px 0 var(--line);white-space:nowrap}
#hitsPlus.pop{animation:hitsplus .9s ease-out}
@keyframes hitsplus{0%{opacity:1;transform:translateY(-40%) scale(.7)}55%{opacity:1;transform:translateY(-80%) scale(1.12)}100%{opacity:0;transform:translateY(-120%) scale(1)}}
#grade{margin:8px 0 2px;padding:6px 16px;border-radius:999px;border:4px solid var(--line);font-weight:900;font-size:clamp(15px,3.6vmin,24px);letter-spacing:.08em;box-shadow:0 3px 0 var(--line);display:none;background:#ffd76a}
#grade.on{display:inline-block;animation:gradepop .45s ease;opacity:1;color:#5b4636}
#grade.g0{background:#ffd76a}#grade.g1{background:#9be3b0}#grade.g2{background:#cfd8ff}#grade.g3{background:#ffe3ef}#grade.g4{background:#e8d5c8}
@keyframes gradepop{0%{opacity:1;transform:scale(.72)}60%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes hitpop{0%{opacity:1;transform:translateY(10px) scale(.7)}55%{opacity:1;transform:translateY(-22px) scale(1.25)}100%{opacity:0;transform:translateY(-44px) scale(1)}}
.low #hitsPlus.pop{animation:none;opacity:1}
@media (orientation:portrait){
  /* Lift only the in-play STOP button off the bottom edge. Title START and the
     result record stay put, and landscape is unchanged. */
  #go.stop{margin-bottom:40px}
}

#entryCatch{position:fixed;left:0;right:0;bottom:0;top:calc(var(--app-top,0px) + var(--chrome-h));z-index:20;background:transparent;pointer-events:auto}
#entryCatch.hide{display:none!important}
#entryGate{position:absolute;left:0;top:0;z-index:21;display:flex;justify-content:center;align-items:flex-start;width:auto;max-width:94vw;margin:0;padding:0;box-sizing:border-box;background:transparent;pointer-events:none}
#entryGate.hide{display:none!important}
#entryGate.out{animation:gateout .28s ease both;pointer-events:none}
#entryGate:not(.hide):not(.out){animation:gatein .4s ease both}
.low #entryGate:not(.hide):not(.out),.low #entryGate.out{animation:none}
.entryCard{background:#fff;border:4px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:12px 22px 10px;width:max-content;max-width:min(94vw,26em);text-align:center;box-sizing:border-box;overflow:visible;color:var(--ink);pointer-events:auto;font-size:clamp(26px,7vmin,44px)}
#entryMsg{margin:0;font-weight:900;font-size:1em;line-height:1.25;letter-spacing:-0.02em;white-space:nowrap}
#entryMsg b{color:var(--title);-webkit-text-stroke:1px var(--line);paint-order:stroke fill}
#entryHint{margin:8px 0 0;font-weight:700;font-size:clamp(12px,2.6vmin,16px);line-height:1.35;opacity:.82}
#entryI18n{margin:6px 0 0;display:flex;flex-direction:column;gap:2px;text-align:left}
.entryLang{margin:0;font-weight:700;font-size:clamp(10px,1.85vmin,13px);line-height:1.3;opacity:.9;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:0;font-family:"Noto Sans CJK KR","Noto Sans CJK SC","Noto Sans CJK JP","Noto Sans KR",system-ui,sans-serif}
.entryLang .langTag{display:inline-block;min-width:3.2em;margin-right:.35em;font-size:.82em;font-weight:800;opacity:.7}
#board{margin:8px auto 2px;background:#fff;border:3px solid var(--line);border-radius:22px;box-shadow:0 3px 0 var(--line);padding:8px 16px 8px;width:max-content;max-width:min(94%,22em);text-align:center;box-sizing:border-box;pointer-events:none;z-index:6;color:var(--ink)}
#board.hide{display:none!important}
#boardPlays{font-weight:800;font-size:clamp(14px,3.4vmin,20px);margin:0 0 4px;line-height:1.3}
#boardPlays b{color:var(--title);font-size:1.15em;-webkit-text-stroke:1px var(--line);paint-order:stroke fill}
#boardTitle{font-weight:900;font-size:clamp(13px,3.2vmin,17px);margin:0 0 2px;letter-spacing:-0.02em}
#boardList{list-style:none;margin:0 auto;padding:0;width:max-content;min-width:9.5em;text-align:left}
#boardList li{display:flex;align-items:baseline;justify-content:space-between;gap:0.7em;font-weight:800;font-size:clamp(15px,3.8vmin,22px);line-height:1.35;margin:0;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#boardList .rk{flex:0 0 auto;min-width:2.2em;text-align:left;color:var(--title);font-weight:900}
#boardList .tm{flex:1 1 auto;text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#boardEmpty{font-weight:700;font-size:clamp(13px,3.2vmin,18px);opacity:.82;margin:2px 0 0;line-height:1.35}
#todayRank{display:none;margin:6px auto 2px;padding:6px 16px;border-radius:999px;border:4px solid var(--line);background:#ffd76a;font-weight:900;font-size:clamp(16px,3.8vmin,26px);box-shadow:0 3px 0 var(--line);color:var(--ink);letter-spacing:-0.02em}
#todayRank.on{display:inline-block}
@media (orientation:portrait) and (max-height:1400px){
  .entryLang{font-size:clamp(10px,1.8vmin,12px);line-height:1.25}
  #entryI18n{margin:4px 0 0;gap:1px}
  #board{padding:6px 12px 6px;margin:6px auto 2px}
}
@media (min-width:720px){

function loadAudioCands(cands,cb){

    try{
      var x=new XMLHttpRequest();x.open('GET',cands[i]);x.responseType='arraybuffer';
      x.onload=function(){

        var a=audioBus();if(!a){if(cb)cb(null);return}
