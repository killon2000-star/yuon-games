<script>
'use strict';
// ===== 문자열(현지화 시 이 객체만 교체) =====
var S={title:'블록 퍼즐',start:'게임 시작',best:'최고 점수',score:'점수',over:'게임 오버',cont:'▶ 광고 보고 이어하기',again:'다시 하기',

praise:['Good!','Great!','Excellent!','Amazing!','Unbelievable!'],combo:'콤보',noSpace:'놓을 곳이 없어요'};
var $=function(i){return document.getElementById(i)};
$('t_title').textContent=S.title;$('bStart').textContent=S.start;$('t_help').textContent=S.help;$('t_over').textContent=S.over;$('bCont').textContent=S.cont;$('bAgain').textContent=S.again;$('t_ad').textContent=S.ad;
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var best=+lsGet('bp_best',0)||0, soundOn=lsGet('bp_snd','1')==='1';
$('t_best').textContent=S.best+': '+best;
// ===== 저사양 감지 =====
var low=(navigator.hardwareConcurrency||4)<=4||(navigator.deviceMemory||4)<=2;
// ===== 도형 =====
function P(s){var a=[],r=s.split('/');for(var i=0;i<r.length;i++)for(var j=0;j<r[i].length;j++)if(r[i][j]==='x')a.push([i,j]);return a}
var SH=[ // [모양, 난이도등급 0쉬움~2어려움]
['x',0],['xx',0],['x/x',0],['xxx',0],['x/x/x',0],['xx/xx',0],['xx/x.',0],['xx/.x',0],['x./xx',0],['.x/xx',0],
['xxxx',1],['x/x/x/x',1],['x./x./xx',1],['xx/.x/.x',1],['..x/xxx',1],['xxx/x..',1],['xxx/.x.',1],['.x./xxx',1],['x./xx/x.',1],['.x/xx/.x',1],
['xx./.xx',1],['.xx/xx.',1],['x./xx/.x',1],['.x/xx/x.',1],['x../.x./..x',2],['..x/.x./x..',2],
['xxxxx',2],['x/x/x/x/x',2],['xxx/xxx',2],['xx/xx/xx',2],['xxx/xxx/xxx',2],['x../x../xxx',2],['xxx/..x/..x',2],['..x/..x/xxx',2],['xxx/x../x..',2]
].map(function(e){var c=P(e[0]),h=0,w=0;c.forEach(function(p){h=Math.max(h,p[0]+1);w=Math.max(w,p[1]+1)});return{c:c,h:h,w:w,g:e[1]}});
var COLORS=['#ff4d6d','#ffb703','#3ddc84','#3a86ff','#b14aed','#ff7b22','#2ee6d6'];
// ===== 상태 =====
var N=8,board,tray,score,combo,sinceClear,playing=false,usedCont,shown=0,dirty=true;
function emptyBoard(){board=[];for(var i=0;i<N;i++){board.push([]);for(var j=0;j<N;j++)board[i].push(-1)}}
function fits(sh,r,c){for(var k=0;k<sh.c.length;k++){var y=r+sh.c[k][0],x=c+sh.c[k][1];if(y<0||x<0||y>=N||x>=N||board[y][x]>=0)return false}return true}
function canPlace(sh){for(var r=0;r<=N-sh.h;r++)for(var c=0;c<=N-sh.w;c++)if(fits(sh,r,c))return true;return false}
function pickShape(easy){
 var lv=Math.min(1,score/3000),w=[],tot=0;
 for(var i=0;i<SH.length;i++){var g=SH[i].g,v=g===0?(easy?3:2.2-1.4*lv):g===1?1.2:(easy?0.1:0.3+1.5*lv);w.push(v);tot+=v}
 var r=Math.random()*tot;for(i=0;i<SH.length;i++){r-=w[i];if(r<=0)return SH[i]}return SH[0]}
function newTray(easy){
 tray=[];for(var i=0;i<3;i++)tray.push({s:pickShape(easy),col:(Math.random()*COLORS.length)|0});
 if(!tray.some(function(t){return canPlace(t.s)})){ // 최소 하나는 놓을 수 있게
  var cand=SH.filter(canPlace);if(cand.length){cand.sort(function(a,b){return a.c.length-b.c.length});
   tray[(Math.random()*3)|0].s=cand[(Math.random()*Math.min(cand.length,score>2000?4:10))|0]}}
 dirty=true}
function anyMove(){return tray.some(function(t){return t&&canPlace(t.s)})}
// ===== 오디오 =====
var AC=null;
function ac(){if(!soundOn)return null;try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f,d,type,vol,delay){var a=ac();if(!a)return;try{var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
var sfx={pick:function(){tone(520,.06,'triangle',.08)},place:function(){tone(220,.09,'square',.06)},
 clear:function(n){for(var i=0;i<Math.min(n+2,6);i++)tone(523*Math.pow(1.19,i),.16,'triangle',.12,i*.06)},
 over:function(){tone(300,.3,'sawtooth',.08);tone(200,.5,'sawtooth',.08,.25)}};
// ===== 캔버스/레이아웃 =====
var cv=$('c'),cx=cv.getContext('2d'),W,H,dpr,L={},sprites={};
function safe(){var d=document.createElement('div');d.style.cssText='position:fixed;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom)';document.body.appendChild(d);var r=d.getBoundingClientRect(),t=r.top,b=innerHeight-r.bottom;d.remove();return[t,b]}
function layout(){
 W=innerWidth;H=innerHeight;dpr=Math.min(window.devicePixelRatio||1,low?1.5:2);

 var sa=safe(),top=sa[0]+70,bot=H-sa[1];
 var bs=Math.min(W*.94,(bot-top)*.66);L.cell=Math.floor(bs/N);bs=L.cell*N;

 L.ty=L.by+bs+(bot-L.by-bs)/2;L.slotW=W/3;L.mini=Math.min(L.cell*.6,(bot-L.by-bs)/5.6);
 sprites={};dirty=true}

function shade(hex,a){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;function f(v){return Math.max(0,Math.min(255,a>0?v+(255-v)*a:v*(1+a)))|0}return'rgb('+f(r)+','+f(g)+','+f(b)+')'}
function sprite(ci,s){ // 보석 블록 스프라이트 캐시

 var col=COLORS[ci]||'#555',m=s*.04,r=s*.16,b=s*.14;
 rr(c,m,m,s-2*m,s-2*m,r);c.fillStyle=shade(col,-.45);c.fill();
 c.fillStyle=shade(col,.35);c.beginPath();c.moveTo(m,m);c.lineTo(s-m,m);c.lineTo(s-m-b,m+b);c.lineTo(m+b,m+b);c.closePath();c.fill();
 c.fillStyle=shade(col,.12);c.beginPath();c.moveTo(m,m);c.lineTo(m+b,m+b);c.lineTo(m+b,s-m-b);c.lineTo(m,s-m);c.closePath();c.fill();
 c.fillStyle=shade(col,-.25);c.beginPath();c.moveTo(s-m,m);c.lineTo(s-m,s-m);c.lineTo(s-m-b,s-m-b);c.lineTo(s-m-b,m+b);c.closePath();c.fill();

function blk(ci,x,y,s,a){if(a!=null)cx.globalAlpha=a;cx.drawImage(sprite(ci,s),x,y,s,s);cx.globalAlpha=1}
// ===== 드래그 =====
var drag=null; // {i,x,y,gr,gc,lines}
function slotCenter(i){return[L.slotW*(i+.5),L.ty]}
function lift(){return L.cell*2.2} // 손가락 위로 띄우는 거리
function dragOrigin(t,fx,fy){var s=L.cell;return[fx-t.s.w*s/2,fy-lift()-t.s.h*s/2]}
function fingerFor(i,r,c){var t=tray[i],s=L.cell;return[L.bx+c*s+t.s.w*s/2,L.by+r*s+t.s.h*s/2+lift()]}
function linesIf(sh,r,c){var rows=[],cols=[],i,j,k,set={};for(k=0;k<sh.c.length;k++)set[(r+sh.c[k][0])*N+c+sh.c[k][1]]=1;
 for(i=0;i<N;i++){var fr=true,fc=true;for(j=0;j<N;j++){if(board[i][j]<0&&!set[i*N+j])fr=false;if(board[j][i]<0&&!set[j*N+i])fc=false}if(fr)rows.push(i);if(fc)cols.push(i)}return{rows:rows,cols:cols}}
function updGhost(){var t=tray[drag.i],o=dragOrigin(t,drag.x,drag.y),c=Math.round((o[0]-L.bx)/L.cell),r=Math.round((o[1]-L.by)/L.cell);
 if(fits(t.s,r,c)){if(drag.gr!==r||drag.gc!==c){drag.gr=r;drag.gc=c;drag.lines=linesIf(t.s,r,c)}}else{drag.gr=null;drag.lines=null}}
function down(x,y){if(!playing||drag)return;var i=Math.floor(x/L.slotW);if(i<0||i>2||!tray[i]||Math.abs(y-L.ty)>L.mini*3.2)return;
 drag={i:i,x:x,y:y,gr:null};updGhost();sfx.pick();dirty=true}
function move(x,y){if(!drag)return;drag.x=x;drag.y=y;updGhost();dirty=true}
function up(){if(!drag)return;var d=drag;drag=null;dirty=true;if(d.gr!=null)place(d.i,d.gr,d.gc)}
// ===== 배치/클리어/점수 =====
var parts=[],texts=[],shake=0,flash=[];
function place(i,r,c){
 var t=tray[i];t.s.c.forEach(function(p){board[r+p[0]][c+p[1]]=t.col});tray[i]=null;score+=t.s.c.length;sfx.place();
 var ln=linesIf({c:[]},0,0),n=ln.rows.length+ln.cols.length;
 if(n){combo++;sinceClear=0;var pts=10*n*n*combo;score+=pts;
  var cells={};ln.rows.forEach(function(y){for(var x=0;x<N;x++)cells[y*N+x]=1});ln.cols.forEach(function(x){for(var y=0;y<N;y++)cells[y*N+x]=1});
  for(var k in cells){var y=k/N|0,x=k%N,col=board[y][x];flash.push({x:x,y:y,col:col,t:0});board[y][x]=-1;
   var pc=low?2:6;for(var q=0;q<pc;q++){var a=Math.random()*6.28,v=1+Math.random()*4;parts.push({x:L.bx+(x+.5)*L.cell,y:L.by+(y+.5)*L.cell,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,col:COLORS[col]})}}
  texts.push({s:S.praise[Math.min(n+combo-2,4)],y:L.by+L.bs*.4,t:0,big:1});
  if(combo>1)texts.push({s:S.combo+' x'+combo,y:L.by+L.bs*.55,t:0});
  texts.push({s:'+'+pts,y:L.by+L.bs*.68,t:0,small:1});shake=low?0:8;sfx.clear(n);
 }else if(++sinceClear>=3)combo=0;
 if(score>best){best=score;lsSet('bp_best',best)}
 if(!tray[0]&&!tray[1]&&!tray[2])newTray();
 if(!anyMove())setTimeout(gameOver,600)}
function gameOver(){if(!playing)return;playing=false;sfx.over();texts.push({s:S.noSpace,y:L.by+L.bs/2,t:0});
 setTimeout(function(){$('t_score').textContent=S.score+': '+score;$('t_best2').textContent=(score>=best&&score>0?S.newBest+' ':'')+S.best+': '+best;
  $('bCont').className='btn b2'+(usedCont?' hide':'');$('over').className='ov'},700)}
function newGame(){emptyBoard();score=0;combo=0;sinceClear=0;usedCont=false;parts=[];texts=[];flash=[];newTray(true);playing=true;$('over').className='ov hide';$('snd').className='';dirty=true}
function cont(){usedCont=true;$('over').className='ov hide';$('ad').className='ov';var n=3;$('t_adc').textContent=n;
 var iv=setInterval(function(){n--;$('t_adc').textContent=n;if(n<=0){clearInterval(iv);$('ad').className='ov hide';
  // 보상: 놓을 수 있는 작은 블록 3개
  tray=[];var sm=SH.filter(function(s){return s.c.length<=3&&canPlace(s)});
  for(var i=0;i<3;i++)tray.push(sm.length?{s:sm[(Math.random()*sm.length)|0],col:(Math.random()*7)|0}:{s:SH[0],col:0});
  playing=true;dirty=true;if(!anyMove())gameOver()}},700)}
// ===== 렌더 =====
var shownScore=0,last=0,raf=0,fpsN=0,fpsT=0,slowFrames=0;
function frame(ts){raf=requestAnimationFrame(frame);var dt=Math.min(50,ts-(last||ts));last=ts;
 if(dt>40&&++slowFrames>90&&!low){low=true;sprites={}} // 실행 중 저사양 전환
 window.__fps=window.__fps||[];fpsN++;if(ts-fpsT>1000){window.__fps.push(fpsN*1000/(ts-fpsT));fpsN=0;fpsT=ts}
 var anim=parts.length||texts.length||flash.length||shake>0||shownScore!==score;if(!anim&&!dirty)return;dirty=false;draw(dt)}
function draw(dt){
 var g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#241a52');g.addColorStop(1,'#0e0a26');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 cx.save();if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake-=dt*.03}
 if(shownScore<score)shownScore=Math.min(score,shownScore+Math.max(1,Math.ceil((score-shownScore)*.15)));else shownScore=score;
 cx.textAlign='center';cx.fillStyle='#ffd34e';cx.font='bold 14px sans-serif';cx.fillText('👑 '+best,W/2,L.top+20);
 cx.fillStyle='#fff';cx.font='bold 36px sans-serif';cx.fillText(shownScore,W/2,L.top+58);
 var s=L.cell,i,j;rr(cx,L.bx-6,L.by-6,L.bs+12,L.bs+12,10);cx.fillStyle='#1a1440';cx.fill();
 var hl={};if(drag&&drag.lines){drag.lines.rows.forEach(function(y){for(var x=0;x<N;x++)hl[y*N+x]=1});drag.lines.cols.forEach(function(x){for(var y=0;y<N;y++)hl[y*N+x]=1})}
 var dc=drag?tray[drag.i].col:0;
 for(i=0;i<N;i++)for(j=0;j<N;j++){var x=L.bx+j*s,y=L.by+i*s;
  if(board[i][j]>=0)blk(hl[i*N+j]?dc:board[i][j],x,y,s);else{cx.fillStyle='#2a2260';rr(cx,x+2,y+2,s-4,s-4,4);cx.fill()}
  if(hl[i*N+j]){cx.fillStyle='rgba(255,255,255,.25)';cx.fillRect(x+2,y+2,s-4,s-4)}}
 if(drag&&drag.gr!=null){var t=tray[drag.i];t.s.c.forEach(function(p){blk(t.col,L.bx+(drag.gc+p[1])*s,L.by+(drag.gr+p[0])*s,s,.4)})}
 for(i=flash.length-1;i>=0;i--){var f=flash[i];f.t+=dt/300;if(f.t>=1){flash.splice(i,1);continue}var sc=s*(1-f.t);blk(f.col,L.bx+f.x*s+(s-sc)/2,L.by+f.y*s+(s-sc)/2,sc,1-f.t)}
 for(i=0;i<3;i++){var tt=tray[i];if(!tt||(drag&&drag.i===i))continue;var m=L.mini,c=slotCenter(i),ok=canPlace(tt.s),ox=c[0]-tt.s.w*m/2,oy=c[1]-tt.s.h*m/2;
  tt.s.c.forEach(function(p){blk(tt.col,ox+p[1]*m,oy+p[0]*m,m,ok?1:.35)})}
 if(drag){var td=tray[drag.i],o=dragOrigin(td,drag.x,drag.y);td.s.c.forEach(function(p){blk(td.col,o[0]+p[1]*s,o[1]+p[0]*s,s)})}
 cx.restore();
 for(i=parts.length-1;i>=0;i--){var q=parts[i];q.x+=q.vx*dt*.06;q.y+=q.vy*dt*.06;q.vy+=.15*dt*.06;q.l-=dt/700;if(q.l<=0){parts.splice(i,1);continue}cx.globalAlpha=q.l;cx.fillStyle=q.col;cx.fillRect(q.x-3,q.y-3,6,6)}
 cx.globalAlpha=1;
 for(i=texts.length-1;i>=0;i--){var x2=texts[i];x2.t+=dt/1100;if(x2.t>=1){texts.splice(i,1);continue}
  var sz=(x2.big?44:x2.small?26:32)*(x2.t<.15?.5+x2.t*3.3:1);cx.globalAlpha=x2.t>.7?(1-x2.t)/.3:1;cx.font='900 '+sz+'px sans-serif';
  cx.lineWidth=6;cx.strokeStyle='#4a1d7a';cx.strokeText(x2.s,W/2,x2.y-x2.t*30);cx.fillStyle=x2.big?'#ffe14d':'#fff';cx.fillText(x2.s,W/2,x2.y-x2.t*30)}
 cx.globalAlpha=1}
// ===== 입력 (pointer → touch → mouse) =====
function pos(e){var r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
if(window.PointerEvent){var pid=null;

}else if('ontouchstart' in window){var tid=null;
